<title>יומן גבייה לקליניקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one quiet column — the month's answer first (hero), then who still owes, then detail. Navy is the only hue; red/green only mark debt/paid. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #18202b;
  --ink-2: #4a5462;
  --muted: #7d8694;
  --line: #e4e7ec;
  --accent: #1f3b63;
  --accent-ink: #ffffff;
  --accent-soft: #e7edf5;
  --bar: #c5d2e3;
  --good: #1b7547;
  --good-soft: #e5f3eb;
  --bad: #b3261e;
  --bad-soft: #fcebe9;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --f-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --f-body: "Assistant", "Arial Hebrew", Arial, sans-serif;
  --f-num: "Rubik", "Assistant", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #191e25; --surface-2: #1f252d; --ink: #eef1f5; --ink-2: #b9c1cc; --muted: #868f9c; --line: #2b323c;
    --accent: #93b4e4; --accent-ink: #0f1722; --accent-soft: #1e2a3a; --bar: #344760;
    --good: #5fc991; --good-soft: #17301f; --bad: #f08c84; --bad-soft: #3a1d1b; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #191e25; --surface-2: #1f252d; --ink: #eef1f5; --ink-2: #b9c1cc; --muted: #868f9c; --line: #2b323c;
  --accent: #93b4e4; --accent-ink: #0f1722; --accent-soft: #1e2a3a; --bar: #344760;
  --good: #5fc991; --good-soft: #17301f; --bad: #f08c84; --bad-soft: #3a1d1b; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.app { max-width: 1040px; margin: 0 auto; padding: 0 16px; padding-block: 20px 72px; display: grid; gap: 24px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px 16px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1.15; }
.brand p { margin: 0; color: var(--muted); font-size: .92rem; }
.month { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.month button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; color: var(--ink-2); display: grid; place-items: center; }
.month button:hover { background: var(--surface-2); }
.month b { min-width: 120px; text-align: center; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 12px; font-size: .9rem; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
@media (max-width: 640px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; }
  .top .month { grid-column: 1 / -1; justify-self: stretch; justify-content: space-between; }
  .brand h1 { font-size: 1.4rem; }
}

/* tabs */
.tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--ink-2); border-radius: 8px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 16px 20px 0; }
.card-h h2 { font-size: 1.12rem; font-weight: 700; }
.card-h .hint { color: var(--muted); font-size: .88rem; }
.card-b { padding: 12px 20px 18px; }
.stack { display: grid; gap: 20px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; display: grid; gap: 10px; justify-items: center; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.hero-main { padding: 22px 24px; display: grid; gap: 6px; align-content: start; }
.eyebrow { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.big { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 2.9rem; font-weight: 500; line-height: 1.1; letter-spacing: -.01em; }
.progress { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.prog-txt { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--ink-2); font-size: .92rem; }
.prog-txt b { color: var(--ink); font-family: var(--f-num); font-weight: 500; }
.hero-side { border-inline-start: 1px solid var(--line); display: grid; }
.fig { padding: 18px 24px; display: grid; gap: 2px; align-content: center; }
.fig + .fig { border-top: 1px solid var(--line); }
.fig .lbl { color: var(--ink-2); font-weight: 600; font-size: .92rem; }
.fig b { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 1.7rem; line-height: 1.2; }
.fig.bad b { color: var(--bad); }
.fig.good b { color: var(--good); }
.fig .s { color: var(--muted); font-size: .88rem; }
@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-side { border-inline-start: 0; border-top: 1px solid var(--line); grid-template-columns: 1fr 1fr; }
  .fig + .fig { border-top: 0; border-inline-start: 1px solid var(--line); }
  .big { font-size: 2.3rem; }
  .hero-main, .fig { padding-inline: 18px; }
}

/* list tables */
.tbl { display: grid; }
.tr { display: grid; align-items: center; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.th { color: var(--muted); font-size: .82rem; font-weight: 600; padding-block: 4px 8px; border-top: 0; }
.amt { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; text-align: left; white-space: nowrap; }
.amt.bad { color: var(--bad); }
.sub { color: var(--muted); font-size: .86rem; }
.link { background: none; border: 0; padding: 0; font-weight: 700; text-align: right; color: var(--ink); }
.link:hover { color: var(--accent); text-decoration: underline; }

/* debts */
.debts .tr { grid-template-columns: minmax(0, 1fr) auto auto; }
.debt-total { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--line); font-weight: 700; }

/* methods */
.mrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 3.2em; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.micon { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; grid-row: 1 / span 2; }
.mrow .mt { font-weight: 600; }
.mrow .mbar { grid-column: 2 / span 3; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.mrow .mbar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.mrow .pct { color: var(--muted); font-size: .85rem; text-align: left; font-family: var(--f-num); }

/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 12px; }
.chart text.v { fill: var(--ink-2); font-size: 12.5px; }
.chart text.cur { fill: var(--ink); font-weight: 600; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .b { fill: var(--bar); }
.chart .b.cur { fill: var(--accent); }
.chart .hit { fill: transparent; }
.chart .hit:hover, .chart .hit.on { fill: var(--surface-2); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: .85rem; line-height: 1.5; min-width: 160px; z-index: 2; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }

/* status */
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .92rem; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.st.paid { color: var(--good); }
.st.part, .st.due { color: var(--bad); }
.st.none, .st.future { color: var(--muted); }
.via { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: .88rem; white-space: nowrap; }
.via .ico { width: 15px; height: 15px; }

/* toolbar */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; }
.chips { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.chips button { border: 0; background: none; border-radius: 8px; padding: 5px 12px; font-size: .92rem; font-weight: 600; color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chips .n { color: var(--muted); font-family: var(--f-num); margin-inline-start: 5px; font-weight: 400; }

/* sessions table */
.sess .tr { grid-template-columns: 84px minmax(0, 1fr) 84px 230px 236px; cursor: pointer; padding-inline: 8px; margin-inline: -8px; border-radius: 8px; }
.sess .tr:not(.th):hover { background: var(--surface-2); }
.sess .th { cursor: default; }
.sess .dt { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.sess .dt small { display: block; color: var(--muted); font-family: var(--f-body); font-size: .82rem; }
.sess .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.sess .nm .sub { font-weight: 400; display: block; }
.sess .stc { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.pay { display: flex; gap: 4px; justify-content: flex-end; }
.qp { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: .86rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.qp:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.qp .ico { width: 15px; height: 15px; }
.edit-hint { color: var(--muted); font-size: .86rem; text-align: left; }
@media (max-width: 820px) {
  .sess .th { display: none; }
  .sess .tr { grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "dt nm amt" "dt stc stc" "pay pay pay"; row-gap: 6px; }
  .sess .dt { grid-area: dt; align-self: start; }
  .sess .nm { grid-area: nm; }
  .sess .amtc { grid-area: amt; }
  .sess .stc { grid-area: stc; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .sess .pay { grid-area: pay; justify-content: flex-start; }
  .sess .edit-hint { display: none; }
}
.readonly .pay, .readonly .write-only { display: none !important; }

/* patients */
.pts .tr { grid-template-columns: minmax(0, 1fr) 110px 100px 110px 120px; cursor: pointer; padding-inline: 8px; margin-inline: -8px; border-radius: 8px; }
.pts .tr:not(.th):hover { background: var(--surface-2); }
.pts .tr.archived { opacity: .55; }
.pts .c { text-align: left; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  .pts .tr { grid-template-columns: minmax(0, 1fr) auto; }
  .pts .th { display: none; }
  .pts .c.hide-sm { display: none; }
  .pts .show-sm { display: block; }
  .pts .pn { display: grid; }
}

/* calendar */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pick { min-width: 200px; flex: 0 1 260px; }
.pick select, .pick input { padding-block: 7px; }
.pf { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
.pf > div { flex: 1; min-width: 180px; display: grid; }
.pf .sub { color: var(--ink-2); }
.legend-row { display: flex; gap: 6px 18px; flex-wrap: wrap; }
.legend-row .st { font-size: .85rem; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cal .wd { background: var(--surface-2); color: var(--ink-2); font-size: .82rem; font-weight: 700; text-align: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cal .day { min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); cursor: pointer; min-width: 0; }
.cal .wd + .day, .cal .day:nth-child(7n + 1) { border-inline-start: 0; }
.cal .wd ~ .day:nth-child(-n + 14) { border-top: 0; }
.cal .day:hover { background: var(--surface-2); }
.cal .day.out { background: var(--surface-2); cursor: default; opacity: .5; }
.cal .day.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cal .day.sat .dn { color: var(--muted); }
.cal .dn { font-family: var(--f-num); font-size: .9rem; font-weight: 500; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cal .today .dn { background: var(--accent); color: var(--accent-ink); }
.ev { display: block; font-size: .8rem; font-weight: 600; line-height: 1.35; padding: 2px 7px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-inline-end: 5px; vertical-align: middle; }
.ev:hover { filter: brightness(.96); text-decoration: underline; }
.ev.paid { background: var(--good-soft); color: var(--good); }
.ev.due, .ev.part { background: var(--bad-soft); color: var(--bad); }
.ev.future { background: var(--surface-2); color: var(--ink-2); }
.ev.none { background: transparent; color: var(--muted); text-decoration: line-through; }
.cal .more { font-size: .78rem; color: var(--muted); padding-inline: 6px; }
.cal .dots { display: none; }
.cal .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.dots i.paid { background: var(--good); } .dots i.due, .dots i.part { background: var(--bad); } .dots i.future { background: var(--muted); } .dots i.none { background: transparent; border: 1px solid var(--muted); }
.daypanel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 6px; }
.daypanel .panel-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.daypanel h3 { font-size: 1.05rem; }
@media (max-width: 700px) {
  .cal .day { min-height: 58px; padding: 4px; align-items: center; }
  .cal .ev, .cal .more { display: none; }
  .cal .dots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .pick { flex: 1 1 100%; }
}
.pts .tr.tfoot { border-top: 2px solid var(--line); font-weight: 700; cursor: default; }
.pts .tr.tfoot:hover { background: none; }
.cnt { display: inline-grid; place-items: center; min-width: 28px; height: 24px; padding-inline: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cnt.zero { background: none; color: var(--muted); }
.show-sm { display: none; }

/* forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lab { font-weight: 600; font-size: .9rem; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 64px; resize: vertical; }
.fr { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.note { color: var(--muted); font-size: .9rem; margin: 0; }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.info { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

/* dialog */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(580px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(15, 20, 30, .45); }
.dlg { display: grid; gap: 16px; padding: 20px; }
.dlg-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dlg-h h2 { font-family: var(--f-display); font-size: 1.35rem; }
.dlg-h .x { border: 0; background: none; font-size: 1.5rem; line-height: 1; color: var(--muted); width: 36px; height: 36px; border-radius: 8px; }
.dlg-h .x:hover { background: var(--surface-2); }
.dlg-f { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.dlg-f .end { display: flex; gap: 8px; margin-inline-start: auto; }
.section { display: grid; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.section h3 { font-size: 1rem; }
.paylist { display: grid; gap: 6px; }
.payrow { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; flex-wrap: wrap; }
.payrow .grow { flex: 1; min-width: 0; color: var(--muted); font-size: .86rem; }
.confirm { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; }
.mini > div { padding: 12px 14px; display: grid; }
.mini > div + div { border-inline-start: 1px solid var(--line); }
.mini .lbl { color: var(--ink-2); font-size: .85rem; font-weight: 600; }
.mini b { font-family: var(--f-num); font-weight: 500; font-size: 1.3rem; }
.mini .bad b { color: var(--bad); }
.mini .good b { color: var(--good); }

/* toast */
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; display: flex; gap: 16px; align-items: center; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; }
</style>

  <symbol id="i-credit" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v4M18 10v4"/></symbol>
  <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M3.5 9.5 12 4.5l8.5 5M5.5 10v7M10 10v7M14 10v7M18.5 10v7M3.5 19.5h17"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="app" id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <h1 id="clinic-name">יומן גבייה</h1>
      <p id="today-line"></p>
    </div>
    <div class="month" role="group" aria-label="בחירת חודש">
      <button type="button" id="m-prev" aria-label="החודש הקודם"><svg class="ico"><use href="#i-prev"/></svg></button>
      <b id="m-label"></b>
      <button type="button" id="m-next" aria-label="החודש הבא"><svg class="ico"><use href="#i-next"/></svg></button>
    </div>
    <button type="button" class="btn primary write-only" id="add-session"><svg class="ico"><use href="#i-plus"/></svg>פגישה חדשה</button>
  </header>

  <div id="banner" class="info" hidden></div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="dash" aria-selected="true">סיכום</button>
    <button type="button" role="tab" data-tab="sessions" aria-selected="false">פגישות</button>
    <button type="button" role="tab" data-tab="patients" aria-selected="false">מטופלות</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">הגדרות וייצוא</button>
  </nav>

  <main id="view"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body" dir="rtl" lang="he"></div></dialog>
<div class="toast" id="toast" hidden dir="rtl"><span id="toast-msg"></span><button type="button" id="toast-undo" hidden>ביטול</button></div>

<script>
(function () {
  "use strict";

  // ---------- constants & helpers ----------
  const METHODS = {
    credit: { label: "אשראי", icon: "i-credit" },
    cash: { label: "מזומן", icon: "i-cash" },
    transfer: { label: "העברה בנקאית", short: "העברה", icon: "i-transfer" },
  };
  const METHOD_KEYS = ["credit", "cash", "transfer"];
  const STATUS = { held: "התקיימה", late: "בוטלה – בחיוב", free: "בוטלה – ללא חיוב" };
  const icon = (id) => '<svg class="ico" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const mLabel = (k, short) => (METHODS[k] ? (short && METHODS[k].short) || METHODS[k].label : k);
  const nis = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 });
  const money = (n) => nis.format(Math.round(n || 0)) + " ₪";
  const pad = (n) => String(n).padStart(2, "0");
  const isoDate = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayISO = () => isoDate(new Date());
  const ymOf = (iso) => iso.slice(0, 7);
  const addMonths = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
  const monthName = (ym, opts) => { const [y, m] = ym.split("-").map(Number); return new Intl.DateTimeFormat("he-IL", opts || { month: "long", year: "numeric" }).format(new Date(y, m - 1, 1)); };
  const weekday = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Intl.DateTimeFormat("he-IL", { weekday: "long" }).format(new Date(y, m - 1, d)); };
  const shortDate = (iso) => { const [, m, d] = iso.split("-"); return Number(d) + "." + Number(m); };
  const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, one, many) => (n === 1 ? one : n + " " + many);
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  // ---------- state ----------
  const S = {
    db: null, downloads: null, canWrite: true, ready: false, noDb: false,
    settings: { clinicName: "", defaultPrice: 400 },
    patients: new Map(), sessions: new Map(),
    month: ymOf(todayISO()), tab: "dash", filter: "all",
    sview: "cal", patientFilter: "", selDay: "", pSearch: "", pFilter: "active",
  };
  try { const t = localStorage.getItem("gvia-tab"); if (t) S.tab = t; const sv = localStorage.getItem("gvia-sview"); if (sv) S.sview = sv; } catch (e) { /* storage unavailable */ }

  const charge = (s) => (s.status === "free" ? 0 : Number(s.price) || 0);
  const paidOf = (s) => (s.payments || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const balOf = (s) => Math.max(0, charge(s) - paidOf(s));
  const isFuture = (s) => s.date > todayISO();
  const patientName = (id) => { const p = S.patients.get(id); return p ? p.name : "מטופלת שנמחקה"; };
  const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const sortedSessions = () => Array.from(S.sessions.values()).sort(byDateDesc);

  function payState(s) {
    if (s.status === "free") return { cls: "none", label: "ללא חיוב" };
    const paid = paidOf(s), c = charge(s);
    if (c > 0 && paid >= c) return { cls: "paid", label: "שולם" };
    if (paid > 0) return { cls: "part", label: "שולם חלקית" };
    if (isFuture(s)) return { cls: "future", label: "טרם התקיימה" };
    return { cls: "due", label: "לא שולם" };
  }

  // ---------- writes (one at a time per document) ----------
  const chains = new Map();
  function queueWrite(path, fn) {
    const prev = chains.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    chains.set(path, next);
    return next;
  }
  function writeErr(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.canWrite = false; applyWriteMode(); toast("אין לך הרשאת עריכה בדף הזה. רק בעלת הדף ועורכות יכולות לשמור."); }
    else if (code === "quota_exceeded") toast("מקום האחסון מלא. מחקי נתונים ישנים ונסי שוב.");
    else toast("השמירה לא הצליחה. בדקי את החיבור לאינטרנט ונסי שוב.");
    throw e;
  }
  function setDoc(col, id, data) { return queueWrite(col + "/" + id, () => S.db.collection(col).doc(id).set(data)).catch(writeErr); }
  function updDoc(col, id, data) { return queueWrite(col + "/" + id, () => S.db.collection(col).doc(id).update(data)).catch(writeErr); }
  function delDoc(col, id) { return queueWrite(col + "/" + id, () => S.db.collection(col).doc(id).delete()).catch(writeErr); }
  function newId(col) { return S.db.collection(col).doc().id; }
  function plain(s) { const o = Object.assign({}, s); delete o.id; o.payments = (s.payments || []).map((p) => Object.assign({}, p)); return o; }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, undo) {
    const t = $("#toast"), u = $("#toast-undo");
    $("#toast-msg").textContent = msg;
    u.hidden = !undo;
    u.onclick = undo ? () => { t.hidden = true; undo(); } : null;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 3500);
  }

  // ---------- quick pay ----------
  function quickPay(sid, method) {
    const s = S.sessions.get(sid); if (!s) return;
    const amount = balOf(s); if (amount <= 0) return;
    const before = (s.payments || []).map((p) => Object.assign({}, p));
    const payments = before.concat([{ amount, method, date: todayISO(), receipt: "" }]);
    updDoc("sessions", sid, { payments }).then(() => {
      toast(patientName(s.patientId) + ": נרשם תשלום " + money(amount) + " ב" + mLabel(method), () => updDoc("sessions", sid, { payments: before }));
    }, () => {});
  }

  // ---------- render ----------
  function render() {
    $("#clinic-name").textContent = S.settings.clinicName || "יומן גבייה";
    $("#today-line").textContent = "היום " + new Intl.DateTimeFormat("he-IL", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    $("#m-label").textContent = monthName(S.month);
    $$(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    const v = $("#view");
    const focusId = document.activeElement && v.contains(document.activeElement) ? document.activeElement.id : "";
    if (S.noDb) { v.innerHTML = '<div class="card"><div class="empty"><b>הנתונים לא זמינים כאן</b><span>פתחי את הדף מתוך claude.ai כשאת מחוברת לחשבון, כדי לראות ולשמור את נתוני הגבייה.</span></div></div>'; return; }
    if (!S.ready) { v.innerHTML = '<div class="card"><div class="empty">טוען את הנתונים…</div></div>'; return; }
    if (S.tab === "dash") v.innerHTML = viewDash();
    else if (S.tab === "sessions") v.innerHTML = viewSessions();
    else if (S.tab === "patients") v.innerHTML = viewPatients();
    else v.innerHTML = viewSettings();
    if (S.tab === "dash") wireChart();
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.setSelectionRange && el.type === "search") el.setSelectionRange(el.value.length, el.value.length); } }
  }

  function monthStats(ym) {
    const by = { credit: 0, cash: 0, transfer: 0 };
    let collected = 0;
    S.sessions.forEach((s) => (s.payments || []).forEach((p) => {
      if (p.date && ymOf(p.date) === ym) { const a = Number(p.amount) || 0; collected += a; if (by[p.method] != null) by[p.method] += a; }
    }));
    return { collected, by };
  }

  function debtsByPatient() {
    const m = new Map();
    S.sessions.forEach((s) => {
      if (isFuture(s)) return;
      const b = balOf(s); if (b <= 0) return;
      const e = m.get(s.patientId) || { pid: s.patientId, total: 0, count: 0, oldest: s.date };
      e.total += b; e.count += 1; if (s.date < e.oldest) e.oldest = s.date;
      m.set(s.patientId, e);
    });
    return Array.from(m.values()).sort((a, b) => b.total - a.total);
  }

  function viewDash() {
    const ms = monthStats(S.month);
    const inMonth = Array.from(S.sessions.values()).filter((s) => ymOf(s.date) === S.month);
    const held = inMonth.filter((s) => s.status !== "free");
    const cancelled = inMonth.filter((s) => s.status !== "held").length;
    const billed = held.reduce((a, s) => a + charge(s), 0);
    const billedPaid = held.reduce((a, s) => a + Math.min(charge(s), paidOf(s)), 0);
    const debts = debtsByPatient();
    const debtTotal = debts.reduce((a, d) => a + d.total, 0);
    const pct = billed > 0 ? Math.round((billedPaid / billed) * 100) : 0;

    let h = '<div class="stack">';

    // hero
    h += '<section class="card hero"><div class="hero-main">' +
      '<span class="eyebrow">התקבל ב' + esc(monthName(S.month, { month: "long" })) + "</span>" +
      '<span class="big">' + money(ms.collected) + "</span>";
    if (billed > 0) {
      h += '<div class="progress" role="img" aria-label="' + pct + '% מפגישות החודש שולמו"><span style="width:' + pct + '%"></span></div>' +
        '<div class="prog-txt"><span>מפגישות החודש שולמו <b>' + money(billedPaid) + "</b> מתוך <b>" + money(billed) + "</b></span><span><b>" + pct + "%</b></span></div>";
    } else h += '<span class="note">עדיין אין פגישות בחיוב בחודש הזה.</span>';
    h += '</div><div class="hero-side">' +
      '<div class="fig ' + (debtTotal > 0 ? "bad" : "good") + '"><span class="lbl">ממתין לגבייה</span><b>' + money(debtTotal) + '</b><span class="s">' + (debts.length ? "מ-" + plural(debts.length, "מטופלת אחת", "מטופלות") + ", מכל החודשים" : "כל החובות נסגרו") + "</span></div>" +
      '<div class="fig"><span class="lbl">פגישות החודש</span><b>' + held.length + '</b><span class="s">' + (cancelled ? plural(cancelled, "ביטול אחד", "ביטולים") : "ללא ביטולים") + "</span></div>" +
      "</div></section>";

    h += '<div class="cols">';
    // debts
    h += '<section class="card"><div class="card-h"><h2>מי עוד לא שילמה</h2><span class="hint">יתרות פתוחות עד היום</span></div><div class="card-b">';
    if (!debts.length) h += '<div class="empty"><b style="color:var(--good)">אין חובות פתוחים</b><span>כל הפגישות שהתקיימו שולמו.</span></div>';
    else {
      h += '<div class="tbl debts">';
      debts.forEach((d) => {
        h += '<div class="tr"><div><button type="button" class="link" data-open-patient="' + esc(d.pid) + '">' + esc(patientName(d.pid)) + '</button><div class="sub">' + plural(d.count, "פגישה אחת", "פגישות") + " · הראשונה מ-" + shortDate(d.oldest) + "</div></div>" +
          '<span class="amt bad">' + money(d.total) + "</span>" +
          '<button type="button" class="btn small write-only" data-pay-patient="' + esc(d.pid) + '">רישום תשלום</button></div>';
      });
      h += '</div><div class="debt-total"><span>סה״כ</span><span class="amt bad">' + money(debtTotal) + "</span></div>";
    }
    h += "</div></section>";

    // methods
    h += '<section class="card"><div class="card-h"><h2>איך שילמו החודש</h2></div><div class="card-b">';
    if (ms.collected <= 0) h += '<div class="empty">עדיין לא התקבלו תשלומים החודש.</div>';
    else {
      METHOD_KEYS.forEach((k) => {
        const p = Math.round((ms.by[k] / ms.collected) * 100);
        h += '<div class="mrow"><span class="micon">' + icon(METHODS[k].icon) + '</span><span class="mt">' + METHODS[k].label + '</span><span class="amt">' + money(ms.by[k]) + '</span><span class="pct">' + p + '%</span><div class="mbar"><span style="width:' + p + '%"></span></div></div>';
      });
    }
    h += "</div></section></div>";

    // chart
    h += '<section class="card"><div class="card-h"><h2>הכנסות בחצי השנה האחרונה</h2><span class="hint">לפי תאריך התשלום</span></div><div class="card-b"><div class="chart" id="chart">' + chartSVG() + '<div class="tip" id="tip" hidden></div></div></div></section>';
    return h + "</div>";
  }

  let chartData = [];
  function chartSVG() {
    const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(S.month, -i));
    chartData = months.map((ym) => Object.assign({ ym }, monthStats(ym)));
    const W = 640, H = 210, top = 28, bottom = 28;
    const max = Math.max(1, ...chartData.map((d) => d.collected));
    const ph = H - top - bottom;
    const slot = W / chartData.length, bw = Math.min(56, slot * 0.46);
    const y = (v) => top + ph - (v / max) * ph;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="הכנסות בששת החודשים האחרונים">';
    // RTL: oldest month on the right, selected month on the left
    chartData.forEach((d, i) => {
      const cx = W - slot * (i + 0.5);
      const cur = d.ym === S.month;
      s += '<rect class="hit" data-i="' + i + '" x="' + (cx - slot / 2 + 3) + '" y="0" width="' + (slot - 6) + '" height="' + (H - bottom + 4) + '" rx="8"/>';
      if (d.collected > 0) {
        const yt = y(d.collected), yb = top + ph, x0 = cx - bw / 2, x1 = cx + bw / 2, r = Math.min(4, (yb - yt) / 2);
        s += '<path pointer-events="none" class="b' + (cur ? " cur" : "") + '" d="M' + x0 + " " + yb + " V" + (yt + r) + " Q" + x0 + " " + yt + " " + (x0 + r) + " " + yt + " H" + (x1 - r) + " Q" + x1 + " " + yt + " " + x1 + " " + (yt + r) + " V" + yb + ' Z"/>';
        s += '<text pointer-events="none" class="v' + (cur ? " cur" : "") + '" x="' + cx + '" y="' + (yt - 8) + '" text-anchor="middle">' + money(d.collected) + "</text>";
      } else {
        s += '<text pointer-events="none" x="' + cx + '" y="' + (top + ph - 8) + '" text-anchor="middle">—</text>';
      }
      s += '<text pointer-events="none" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle"' + (cur ? ' class="cur"' : "") + ">" + esc(monthName(d.ym, { month: "long" })) + "</text>";
    });
    s += '<line class="base" x1="0" x2="' + W + '" y1="' + (top + ph) + '" y2="' + (top + ph) + '"/>';
    return s + "</svg>";
  }
  function wireChart() {
    const box = $("#chart"); if (!box) return;
    const tip = $("#tip");
    const show = (el) => {
      $$(".hit.on", box).forEach((x) => x.classList.remove("on"));
      el.classList.add("on");
      const d = chartData[Number(el.dataset.i)];
      tip.innerHTML = "<b>" + esc(monthName(d.ym)) + "</b>" + METHOD_KEYS.map((k) => '<div class="r"><span>' + METHODS[k].label + '</span><span class="num">' + money(d.by[k]) + "</span></div>").join("") + '<div class="r"><b>סה״כ</b><b class="num">' + money(d.collected) + "</b></div>";
      tip.hidden = false;
      const br = box.getBoundingClientRect(), er = el.getBoundingClientRect();
      const cx = er.left + er.width / 2 - br.left;
      const w = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(cx - w / 2, 0), br.width - w) + "px";
      tip.style.top = (-tip.offsetHeight - 6) + "px";
    };
    $$(".hit", box).forEach((el) => {
      el.addEventListener("pointerenter", () => show(el));
      el.addEventListener("click", () => show(el));
    });
    box.addEventListener("pointerleave", () => { tip.hidden = true; $$(".hit.on", box).forEach((x) => x.classList.remove("on")); });
  }

  function viaHTML(s) {
    const methods = Array.from(new Set((s.payments || []).map((p) => p.method)));
    return methods.map((m) => '<span class="via">' + (METHODS[m] ? icon(METHODS[m].icon) : "") + esc(mLabel(m, true)) + "</span>").join("");
  }

  function sessionRow(s, opts) {
    const noName = !!(opts && opts.noName);
    const st = payState(s), bal = balOf(s), paid = paidOf(s);
    const receipts = (s.payments || []).map((p) => p.receipt).filter(Boolean);
    const subBits = [];
    if (!noName && s.status !== "held") subBits.push(STATUS[s.status]);
    if (s.note) subBits.push(esc(s.note));
    const title = noName ? STATUS[s.status] : esc(patientName(s.patientId));
    let h = '<div class="tr" data-edit="' + esc(s.id) + '">' +
      '<div class="dt">' + shortDate(s.date) + "<small>" + esc(weekday(s.date)) + "</small></div>" +
      '<div class="nm">' + title + (subBits.length ? '<span class="sub">' + subBits.join(" · ") + "</span>" : "") + "</div>" +
      '<div class="amtc"><div class="amt">' + money(charge(s)) + "</div>" + (paid > 0 && bal > 0 ? '<div class="sub amt" style="color:var(--bad)">נותרו ' + money(bal) + "</div>" : "") + "</div>" +
      '<div class="stc"><span class="st ' + st.cls + '">' + st.label + "</span>" + viaHTML(s) + (receipts.length ? '<span class="sub">קבלה ' + esc(receipts.join(", ")) + "</span>" : "") + "</div>";
    if (bal > 0) h += '<div class="pay">' + METHOD_KEYS.map((k) => '<button type="button" class="qp" data-qp="' + esc(s.id) + '" data-m="' + k + '" title="סימון כשולם ב' + METHODS[k].label + '">' + icon(METHODS[k].icon) + mLabel(k, true) + "</button>").join("") + "</div>";
    else h += '<div class="edit-hint">עריכה</div>';
    return h + "</div>";
  }

  function sessionFilterMatch(s) {
    if (S.patientFilter && s.patientId !== S.patientFilter) return false;
    if (S.filter === "due") return balOf(s) > 0;
    if (S.filter === "paid") return balOf(s) <= 0;
    return true;
  }

  function patientSelectHTML() {
    const ps = Array.from(S.patients.values()).sort((a, b) => (a.active === b.active ? a.name.localeCompare(b.name, "he") : a.active ? -1 : 1));
    return '<div class="field pick"><label for="s-patient" class="vh">סינון לפי מטופלת</label><select id="s-patient"><option value="">כל המטופלות</option>' +
      ps.map((p) => '<option value="' + esc(p.id) + '"' + (p.id === S.patientFilter ? " selected" : "") + ">" + esc(p.name) + (p.active ? "" : " (בארכיון)") + "</option>").join("") + "</select></div>";
  }

  function viewSessions() {
    if (S.patientFilter && !S.patients.has(S.patientFilter)) S.patientFilter = "";
    const base = Array.from(S.sessions.values()).filter((s) => ymOf(s.date) === S.month && (!S.patientFilter || s.patientId === S.patientFilter));
    const dueN = base.filter((s) => balOf(s) > 0).length;
    const counts = { all: base.length, due: dueN, paid: base.length - dueN };
    const list = base.filter(sessionFilterMatch).sort(byDateDesc);

    let h = '<section class="card"><div class="card-h"><h2>פגישות ' + esc(monthName(S.month)) + "</h2>" +
      '<div class="chips" role="group" aria-label="תצוגה"><button type="button" data-sview="cal" aria-pressed="' + (S.sview === "cal") + '">לוח שנה</button><button type="button" data-sview="list" aria-pressed="' + (S.sview === "list") + '">רשימה</button></div></div>' +
      '<div class="card-b" style="display:grid;gap:14px">' +
      '<div class="toolbar">' + patientSelectHTML() + '<div class="chips">' + fbtn("all", "הכל", counts.all) + fbtn("due", "ממתינות לתשלום", counts.due) + fbtn("paid", "שולמו", counts.paid) + "</div></div>";

    if (S.patientFilter) {
      const sm = patientSummary(S.patientFilter);
      h += '<div class="pf"><div><b>' + esc(patientName(S.patientFilter)) + "</b>" +
        '<span class="sub">' + plural(sm.month, "פגישה אחת", "פגישות") + " ב" + esc(monthName(S.month, { month: "long" })) + " · " + plural(sm.count, "פגישה אחת", "פגישות") + " בסך הכל</span></div>" +
        '<span class="amt' + (sm.total > 0 ? " bad" : "") + '">' + (sm.total > 0 ? "יתרה " + money(sm.total) : '<span class="st paid">אין חוב</span>') + "</span>" +
        '<button type="button" class="btn small" data-open-patient="' + esc(S.patientFilter) + '">כרטיס מטופלת</button>' +
        '<button type="button" class="btn small" id="clear-pf">הצגת כולן</button></div>';
    }

    if (S.sview === "cal") h += calendarHTML(list);
    else if (!list.length) {
      h += '<div class="empty"><span>' + (counts.all ? "אין פגישות שמתאימות לסינון." : "אין פגישות ב" + esc(monthName(S.month)) + (S.patientFilter ? " למטופלת הזו" : "") + ".") + '</span><button type="button" class="btn primary write-only" data-new-session="">' + icon("i-plus") + "הוספת פגישה</button></div>";
    } else {
      h += '<p class="note write-only">לחיצה על אשראי / מזומן / העברה מסמנת שהפגישה שולמה.</p>' +
        '<div class="tbl sess"><div class="tr th"><span>תאריך</span><span>מטופלת</span><span style="text-align:left">סכום</span><span>מצב</span><span style="text-align:left" class="write-only">סימון תשלום</span></div>' + list.map((s) => sessionRow(s)).join("") + "</div>";
    }
    return h + "</div></section>";
  }

  function calendarHTML(list) {
    const [y, m] = S.month.split("-").map(Number);
    const first = new Date(y, m - 1, 1).getDay(); // 0 = Sunday
    const days = new Date(y, m, 0).getDate();
    const today = todayISO();
    if (!S.selDay || ymOf(S.selDay) !== S.month) S.selDay = ymOf(today) === S.month ? today : "";
    const byDay = new Map();
    list.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : patientName(a.patientId).localeCompare(patientName(b.patientId), "he"))).forEach((s) => {
      if (!byDay.has(s.date)) byDay.set(s.date, []);
      byDay.get(s.date).push(s);
    });
    let h = '<div class="legend-row"><span class="st paid">שולם</span><span class="st due">לא שולם</span><span class="st future">טרם התקיימה</span><span class="st none">ללא חיוב</span></div>';
    h += '<div class="cal" role="grid">' + ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"].map((d) => '<div class="wd" role="columnheader">' + d + "</div>").join("");
    for (let i = 0; i < first; i++) h += '<div class="day out" aria-hidden="true"></div>';
    for (let d = 1; d <= days; d++) {
      const iso = S.month + "-" + pad(d);
      const evs = byDay.get(iso) || [];
      const cls = "day" + (iso === today ? " today" : "") + (iso === S.selDay ? " sel" : "") + (new Date(y, m - 1, d).getDay() === 6 ? " sat" : "");
      h += '<div class="' + cls + '" role="gridcell" tabindex="0" data-day="' + iso + '" aria-label="' + d + " ב" + esc(monthName(S.month, { month: "long" })) + (evs.length ? ", " + plural(evs.length, "פגישה אחת", "פגישות") : "") + '"><span class="dn">' + d + "</span>";
      evs.slice(0, 3).forEach((s) => { const st = payState(s); h += '<span class="ev ' + st.cls + '" data-edit="' + esc(s.id) + '" title="' + esc(patientName(s.patientId)) + " · " + st.label + '">' + esc(patientName(s.patientId)) + "</span>"; });
      if (evs.length > 3) h += '<span class="more">+' + (evs.length - 3) + " נוספות</span>";
      if (evs.length) h += '<span class="dots">' + evs.map((s) => '<i class="' + payState(s).cls + '"></i>').join("") + "</span>";
      h += "</div>";
    }
    const tail = (7 - ((first + days) % 7)) % 7;
    for (let i = 0; i < tail; i++) h += '<div class="day out" aria-hidden="true"></div>';
    h += "</div>";

    // selected day panel
    if (S.selDay) {
      const evs = byDay.get(S.selDay) || [];
      const [, mm, dd] = S.selDay.split("-").map(Number);
      h += '<div class="daypanel"><div class="panel-h"><h3>' + esc(weekday(S.selDay)) + ", " + dd + " ב" + esc(monthName(S.month, { month: "long" })) + '</h3><button type="button" class="btn small write-only" data-new-day="' + S.selDay + '">' + icon("i-plus") + "פגישה ביום הזה</button></div>";
      h += evs.length ? '<div class="tbl sess">' + evs.map((s) => sessionRow(s)).join("") + "</div>" : '<p class="note">אין פגישות ביום הזה.</p>';
      h += "</div>";
    } else h += '<p class="note">בחרי יום בלוח כדי לראות את הפגישות שלו ולסמן תשלומים.</p>';
    return h;
  }

  function fbtn(k, label, n) { return '<button type="button" data-filter="' + k + '" aria-pressed="' + (S.filter === k) + '">' + label + '<span class="n">' + n + "</span></button>"; }

  function patientSummary(pid) {
    let total = 0, count = 0, month = 0, last = "";
    S.sessions.forEach((s) => {
      if (s.patientId !== pid) return;
      if (!isFuture(s)) total += balOf(s);
      if (s.status === "free") return;
      count++;
      if (ymOf(s.date) === S.month) month++;
      if (s.date > last && !isFuture(s)) last = s.date;
    });
    return { total, count, month, last };
  }

  function viewPatients() {
    const all = Array.from(S.patients.values()).sort((a, b) => (a.active === b.active ? a.name.localeCompare(b.name, "he") : a.active ? -1 : 1));
    const sums = new Map(all.map((p) => [p.id, patientSummary(p.id)]));
    const counts = { active: all.filter((p) => p.active).length, debt: all.filter((p) => sums.get(p.id).total > 0).length, archived: all.filter((p) => !p.active).length, all: all.length };
    let h = '<section class="card"><div class="card-h"><h2>מטופלות</h2><button type="button" class="btn small write-only" id="add-patient">' + icon("i-plus") + "מטופלת חדשה</button></div>" +
      '<div class="card-b" style="display:grid;gap:14px">' +
      '<div class="toolbar"><div class="field pick"><label for="p-search" class="vh">חיפוש מטופלת</label><input id="p-search" type="search" placeholder="חיפוש לפי שם…" value="' + esc(S.pSearch) + '" autocomplete="off"></div>' +
      '<div class="chips">' + pbtn("active", "פעילות", counts.active) + pbtn("debt", "עם חוב", counts.debt) + pbtn("archived", "בארכיון", counts.archived) + pbtn("all", "הכל", counts.all) + "</div></div>";
    if (!all.length) h += '<div class="empty">עדיין לא נוספו מטופלות. הוסיפי את הראשונה כדי להתחיל לרשום פגישות.</div>';
    else h += '<div id="pts-body">' + patientsTable(all, sums) + "</div>";
    return h + "</div></section>";
  }
  function pbtn(k, label, n) { return '<button type="button" data-pfilter="' + k + '" aria-pressed="' + (S.pFilter === k) + '">' + label + '<span class="n">' + n + "</span></button>"; }
  function patientsTable(all, sums) {
    const q = S.pSearch.trim();
    const rows = all.filter((p) => {
      if (q && !p.name.includes(q)) return false;
      if (S.pFilter === "active") return p.active;
      if (S.pFilter === "archived") return !p.active;
      if (S.pFilter === "debt") return sums.get(p.id).total > 0;
      return true;
    });
    if (!rows.length) return '<div class="empty">' + (q ? "לא נמצאה מטופלת בשם „" + esc(q) + "”." : "אין מטופלות בקבוצה הזו.") + "</div>";
    const mname = esc(monthName(S.month, { month: "long" }));
    let h = '<div class="tbl pts"><div class="tr th"><span>שם</span><span class="c">פגישות ב' + mname + '</span><span class="c">סה״כ פגישות</span><span class="c">פגישה אחרונה</span><span class="c">יתרה לתשלום</span></div>';
    let tm = 0, tc = 0, tb = 0;
    rows.forEach((p) => {
      const sm = sums.get(p.id); tm += sm.month; tc += sm.count; tb += sm.total;
      h += '<div class="tr' + (p.active ? "" : " archived") + '" data-open-patient="' + esc(p.id) + '"><span class="pn"><b>' + esc(p.name) + "</b>" + (p.active ? "" : ' <span class="sub">· בארכיון</span>') +
        '<span class="sub show-sm">' + sm.month + " החודש · " + sm.count + " סה״כ</span></span>" +
        '<span class="c hide-sm"><span class="cnt' + (sm.month ? "" : " zero") + '">' + sm.month + "</span></span>" +
        '<span class="c hide-sm">' + sm.count + "</span>" +
        '<span class="c hide-sm">' + (sm.last ? fmtDate(sm.last) : "—") + "</span>" +
        '<span class="c amt' + (sm.total > 0 ? " bad" : "") + '">' + (sm.total > 0 ? money(sm.total) : '<span class="st paid" style="font-family:var(--f-body)">אין חוב</span>') + "</span></div>";
    });
    h += '<div class="tr tfoot"><span>סה״כ (' + plural(rows.length, "מטופלת אחת", "מטופלות") + ')</span><span class="c hide-sm">' + tm + '</span><span class="c hide-sm">' + tc + '</span><span class="c hide-sm"></span><span class="c amt' + (tb > 0 ? " bad" : "") + '">' + money(tb) + "</span></div>";
    return h + "</div>";
  }

  function viewSettings() {
    const ex = Array.from(S.patients.values()).filter((p) => p.example).length + Array.from(S.sessions.values()).filter((s) => s.example).length;
    let h = '<div class="stack"><div class="cols">';
    h += '<section class="card"><div class="card-h"><h2>הגדרות הקליניקה</h2></div><div class="card-b form">' +
      '<div class="field"><label for="set-name">שם הקליניקה (מופיע בראש הדף)</label><input id="set-name" value="' + esc(S.settings.clinicName) + '" placeholder="לדוגמה: הקליניקה של רחל"></div>' +
      '<div class="field"><label for="set-price">מחיר ברירת מחדל לפגישה (₪)</label><input id="set-price" type="number" min="0" step="10" inputmode="numeric" value="' + esc(S.settings.defaultPrice) + '"></div>' +
      '<div><button type="button" class="btn primary write-only" id="save-settings">שמירת הגדרות</button></div>' +
      '<p class="note">שינוי המחיר חל על פגישות חדשות בלבד.</p></div></section>';

    h += '<section class="card"><div class="card-h"><h2>ייצוא לרואה החשבון</h2></div><div class="card-b form">';
    if (!S.downloads) h += '<p class="note">הורדת קבצים לא זמינה בתצוגה הזו. פתחי את הדף ב-claude.ai כדי לייצא.</p>';
    else {
      const y = S.month.slice(0, 4);
      h += '<div class="field"><label for="exp-range">טווח</label><select id="exp-range"><option value="month">' + esc(monthName(S.month)) + '</option><option value="year">כל שנת ' + y + '</option><option value="all">כל הנתונים</option></select></div>' +
        '<div class="toolbar"><button type="button" class="btn" id="exp-payments">ייצוא תשלומים</button><button type="button" class="btn" id="exp-sessions">ייצוא פגישות ויתרות</button></div>' +
        '<p class="note">קובץ CSV שנפתח באקסל, כולל עברית. „תשלומים” מסודר לפי תאריך התשלום, עם אמצעי התשלום ומספר הקבלה.</p>';
    }
    h += "</div></section></div>";

    h += '<section class="card"><div class="card-h"><h2>פרטיות</h2></div><div class="card-b form"><p class="note">הנתונים נשמרים בענן, בדף הפרטי שלך ב-claude.ai, ומסתנכרנים בין הטלפון למחשב. רק בעלת הדף ומי שהוזמנה כעורכת יכולות לראות ולשנות אותם.</p>';
    if (ex > 0) h += '<div class="toolbar write-only"><span class="note grow">יש כאן ' + ex + ' רשומות דוגמה (מסומנות „דוגמה”).</span><button type="button" class="btn danger" id="clear-examples">מחיקת נתוני הדוגמה</button></div>';
    h += "</div></section></div>";
    return h;
  }

  // ---------- dialogs ----------
  const dlg = $("#dlg"), body = $("#dlg-body");
  function openDlg(html, wire) { body.innerHTML = html; if (!dlg.open) dlg.showModal(); body.scrollTop = 0; wire && wire(); }
  function closeDlg() { if (dlg.open) dlg.close(); }
  dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDlg(); });
  const dlgHead = (t) => '<div class="dlg-h"><h2>' + t + '</h2><button type="button" class="x" data-close aria-label="סגירה">×</button></div>';
  body.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeDlg(); });

  function segHTML(id, items, val) {
    return '<div class="seg" id="' + id + '">' + items.map((it) => '<button type="button" data-v="' + it.v + '" aria-pressed="' + (it.v === val) + '">' + (it.i ? icon(it.i) : "") + it.l + "</button>").join("") + "</div>";
  }
  function wireSeg(id, onChange) {
    const el = $("#" + id);
    el.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      $$("button", el).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      onChange && onChange(b.dataset.v);
    });
  }
  const segVal = (id) => { const b = $("#" + id + ' button[aria-pressed="true"]'); return b ? b.dataset.v : null; };
  const methodItems = (withNone) => (withNone ? [{ v: "none", l: "טרם שולם" }] : []).concat(METHOD_KEYS.map((k) => ({ v: k, l: METHODS[k].label, i: METHODS[k].icon })));

  function patientOptions(selected) {
    const ps = Array.from(S.patients.values()).filter((p) => p.active || p.id === selected).sort((a, b) => a.name.localeCompare(b.name, "he"));
    return '<option value="">בחרי מטופלת…</option>' + ps.map((p) => '<option value="' + esc(p.id) + '"' + (p.id === selected ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + '<option value="__new">+ מטופלת חדשה…</option>';
  }

  function openSession(sid, presetPatient, presetDate) {
    const existing = sid ? S.sessions.get(sid) : null;
    const s = existing ? plain(existing) : { patientId: presetPatient || "", date: presetDate || (S.month === ymOf(todayISO()) ? todayISO() : S.month + "-01"), price: Number(S.settings.defaultPrice) || 400, status: "held", note: "", payments: [] };
    const payments = (s.payments || []).slice();
    const ro = !S.canWrite;
    const html = dlgHead(existing ? "עריכת פגישה" : "פגישה חדשה") +
      '<div class="form">' +
      '<div class="field"><label for="f-patient">מטופלת</label><select id="f-patient">' + patientOptions(s.patientId) + "</select></div>" +
      '<div class="field" id="f-newp-wrap" hidden><label for="f-newp">שם המטופלת החדשה</label><input id="f-newp" placeholder="שם מלא"></div>' +
      '<div class="fr"><div class="field"><label for="f-date">תאריך הפגישה</label><input id="f-date" type="date" value="' + esc(s.date) + '"></div>' +
      '<div class="field"><label for="f-price">מחיר (₪)</label><input id="f-price" type="number" min="0" step="10" inputmode="numeric" value="' + esc(s.price) + '"></div></div>' +
      '<div class="field"><span class="lab">סטטוס</span>' + segHTML("f-status", [{ v: "held", l: STATUS.held }, { v: "late", l: STATUS.late }, { v: "free", l: STATUS.free }], s.status) + "</div>" +
      '<div class="section"><h3>תשלום</h3><div class="paylist" id="f-paylist"></div>' +
      '<div id="f-newpay" class="form"><div class="field"><span class="lab" id="f-newpay-lab">איך שולם?</span>' + segHTML("f-method", methodItems(true), "none") + "</div>" +
      '<div class="fr" id="f-paydetails" hidden><div class="field"><label for="f-amount">סכום (₪)</label><input id="f-amount" type="number" min="0" step="10" inputmode="numeric"></div>' +
      '<div class="field"><label for="f-paydate">תאריך תשלום</label><input id="f-paydate" type="date" value="' + todayISO() + '"></div>' +
      '<div class="field"><label for="f-receipt">מספר קבלה</label><input id="f-receipt" placeholder="לא חובה"></div></div></div></div>' +
      '<div class="field"><label for="f-note">הערה</label><textarea id="f-note" placeholder="לא חובה">' + esc(s.note) + "</textarea></div>" +
      '<div id="f-err" class="banner" hidden></div>' +
      "</div>" +
      '<div class="dlg-f">' + (existing && !ro ? '<button type="button" class="btn danger" id="f-del">מחיקת הפגישה</button>' : "") +
      '<div class="end"><button type="button" class="btn" data-close>ביטול</button>' + (ro ? "" : '<button type="button" class="btn primary" id="f-save">שמירה</button>') + "</div></div>";

    openDlg(html, () => {
      const curCharge = () => (segVal("f-status") === "free" ? 0 : Number($("#f-price").value) || 0);
      const paidSoFar = () => payments.reduce((a, p) => a + (Number(p.amount) || 0), 0);
      const drawPays = () => {
        $("#f-paylist").innerHTML = payments.map((p, i) => '<div class="payrow"><span class="via">' + (METHODS[p.method] ? icon(METHODS[p.method].icon) : "") + esc(mLabel(p.method)) + '</span><b class="num">' + money(p.amount) + '</b><span class="grow">' + fmtDate(p.date) + (p.receipt ? " · קבלה " + esc(p.receipt) : "") + "</span>" + (ro ? "" : '<button type="button" class="btn small danger" data-rmpay="' + i + '">הסרה</button>') + "</div>").join("");
        const rest = Math.max(0, curCharge() - paidSoFar());
        $("#f-newpay-lab").textContent = payments.length ? (rest > 0 ? "תשלום נוסף (נותרו " + money(rest) + ")" : "תשלום נוסף") : "איך שולם?";
        if (segVal("f-method") !== "none" && !$("#f-amount").dataset.touched) $("#f-amount").value = rest || "";
      };
      drawPays();
      $("#f-paylist").addEventListener("click", (e) => { const b = e.target.closest("[data-rmpay]"); if (!b) return; payments.splice(Number(b.dataset.rmpay), 1); drawPays(); });
      wireSeg("f-status", drawPays);
      wireSeg("f-method", (v) => { $("#f-paydetails").hidden = v === "none"; drawPays(); });
      $("#f-amount").addEventListener("input", (e) => { e.target.dataset.touched = "1"; });
      $("#f-price").addEventListener("input", drawPays);
      $("#f-patient").addEventListener("change", (e) => { $("#f-newp-wrap").hidden = e.target.value !== "__new"; if (e.target.value === "__new") $("#f-newp").focus(); });
      if (ro) { $$("input,select,textarea", body).forEach((x) => (x.disabled = true)); $("#f-newpay").hidden = true; return; }
      const del = $("#f-del");
      if (del) del.addEventListener("click", () => {
        del.outerHTML = '<div class="confirm">למחוק את הפגישה לצמיתות? <button type="button" class="btn small danger" id="f-del2">כן, למחוק</button></div>';
        $("#f-del2").addEventListener("click", () => { delDoc("sessions", sid).then(() => { closeDlg(); toast("הפגישה נמחקה"); }, () => {}); });
      });
      $("#f-save").addEventListener("click", async () => {
        const err = $("#f-err"); err.hidden = true;
        const fail = (m) => { err.textContent = m; err.hidden = false; };
        let pid = $("#f-patient").value;
        const date = $("#f-date").value, price = Number($("#f-price").value);
        if (!pid) return fail("בחרי מטופלת.");
        if (pid === "__new" && !$("#f-newp").value.trim()) return fail("כתבי את שם המטופלת החדשה.");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail("בחרי תאריך לפגישה.");
        if (!(price >= 0)) return fail("המחיר צריך להיות מספר.");
        const m = segVal("f-method");
        const finalPays = payments.slice();
        if (m && m !== "none") {
          const amount = Number($("#f-amount").value);
          if (!(amount > 0)) return fail("כתבי את סכום התשלום.");
          finalPays.push({ amount, method: m, date: $("#f-paydate").value || todayISO(), receipt: $("#f-receipt").value.trim() });
        }
        $("#f-save").disabled = true;
        try {
          if (pid === "__new") {
            const npid = newId("patients");
            await setDoc("patients", npid, { name: $("#f-newp").value.trim(), phone: "", note: "", active: true, createdAt: todayISO() });
            pid = npid;
          }
          const data = Object.assign({}, existing ? plain(existing) : { createdAt: todayISO() }, { patientId: pid, date, price, status: segVal("f-status"), note: $("#f-note").value.trim(), payments: finalPays });
          await setDoc("sessions", sid || newId("sessions"), data);
          closeDlg();
          toast(existing ? "הפגישה עודכנה" : "הפגישה נוספה");
          if (!existing && ymOf(date) !== S.month) { S.month = ymOf(date); render(); }
        } catch (e) { $("#f-save").disabled = false; }
      });
    });
  }

  function openPatientEdit(pid) {
    const p = pid ? S.patients.get(pid) : null;
    const sm = pid ? patientSummary(pid) : { count: 0 };
    const html = dlgHead(p ? "פרטי מטופלת" : "מטופלת חדשה") + '<div class="form">' +
      '<div class="field"><label for="p-name">שם מלא</label><input id="p-name" value="' + esc(p ? p.name : "") + '"></div>' +
      '<div class="field"><label for="p-phone">טלפון</label><input id="p-phone" type="tel" dir="ltr" style="text-align:right" value="' + esc(p ? p.phone : "") + '"></div>' +
      '<div class="field"><label for="p-note">הערה</label><textarea id="p-note">' + esc(p ? p.note : "") + "</textarea></div>" +
      (p ? '<div class="field"><span class="lab">מצב</span>' + segHTML("p-active", [{ v: "1", l: "פעילה" }, { v: "0", l: "בארכיון (סיימה טיפול)" }], p.active ? "1" : "0") + "</div>" : "") +
      '<div id="p-err" class="banner" hidden></div></div>' +
      '<div class="dlg-f">' + (p && sm.count === 0 ? '<button type="button" class="btn danger" id="p-del">מחיקה</button>' : "") +
      '<div class="end"><button type="button" class="btn" data-close>ביטול</button><button type="button" class="btn primary" id="p-save">שמירה</button></div></div>';
    openDlg(html, () => {
      if (p) wireSeg("p-active");
      $("#p-name").focus();
      const del = $("#p-del");
      if (del) del.addEventListener("click", () => {
        del.outerHTML = '<div class="confirm">למחוק את המטופלת? <button type="button" class="btn small danger" id="p-del2">כן, למחוק</button></div>';
        $("#p-del2").addEventListener("click", () => delDoc("patients", pid).then(() => { closeDlg(); toast("המטופלת נמחקה"); }, () => {}));
      });
      $("#p-save").addEventListener("click", async () => {
        const name = $("#p-name").value.trim();
        if (!name) { $("#p-err").textContent = "כתבי את שם המטופלת."; $("#p-err").hidden = false; return; }
        const data = Object.assign({}, p ? { createdAt: p.createdAt || todayISO() } : { createdAt: todayISO() }, { name, phone: $("#p-phone").value.trim(), note: $("#p-note").value.trim(), active: p ? segVal("p-active") === "1" : true });
        if (p && p.example) data.example = true;
        $("#p-save").disabled = true;
        try { await setDoc("patients", pid || newId("patients"), data); closeDlg(); toast(p ? "הפרטים נשמרו" : "המטופלת נוספה"); }
        catch (e) { $("#p-save").disabled = false; }
      });
    });
  }

  function openPatient(pid) {
    const p = S.patients.get(pid);
    if (!p) return;
    const list = sortedSessions().filter((s) => s.patientId === pid);
    const sm = patientSummary(pid);
    const paidTotal = list.reduce((a, s) => a + paidOf(s), 0);
    const html = dlgHead(esc(p.name)) +
      '<div class="mini"><div class="' + (sm.total > 0 ? "bad" : "good") + '"><span class="lbl">יתרה לתשלום</span><b>' + money(sm.total) + '</b></div><div><span class="lbl">שולם עד היום</span><b>' + money(paidTotal) + '</b></div><div><span class="lbl">פגישות</span><b>' + sm.count + "</b></div></div>" +
      (p.phone || p.note ? '<p class="note">' + (p.phone ? 'טלפון: <span dir="ltr" class="num" style="user-select:all">' + esc(p.phone) + "</span>" : "") + (p.phone && p.note ? " · " : "") + esc(p.note || "") + "</p>" : "") +
      '<div class="toolbar write-only"><button type="button" class="btn primary" id="pp-new">' + icon("i-plus") + "פגישה</button>" + (sm.total > 0 ? '<button type="button" class="btn" id="pp-pay">רישום תשלום</button>' : "") + '<button type="button" class="btn" id="pp-cal">הצגה בלוח הפגישות</button><span class="grow"></span><button type="button" class="btn" id="pp-edit">עריכת פרטים</button></div>' +
      '<div class="tbl sess" id="pp-rows">' + (list.length ? list.map((s) => sessionRow(s, { noName: true })).join("") : '<div class="empty">עדיין אין פגישות למטופלת הזו.</div>') + "</div>";
    openDlg(html, () => {
      const n = $("#pp-new"); if (n) n.addEventListener("click", () => openSession(null, pid));
      const pay = $("#pp-pay"); if (pay) pay.addEventListener("click", () => openPayPatient(pid));
      const ed = $("#pp-edit"); if (ed) ed.addEventListener("click", () => openPatientEdit(pid));
      const pc = $("#pp-cal"); if (pc) pc.addEventListener("click", () => { closeDlg(); S.patientFilter = pid; S.tab = "sessions"; S.filter = "all"; render(); });
    });
  }

  function openPayPatient(pid) {
    const open = sortedSessions().filter((s) => s.patientId === pid && !isFuture(s) && balOf(s) > 0).reverse(); // oldest first
    const total = open.reduce((a, s) => a + balOf(s), 0);
    const html = dlgHead("רישום תשלום · " + esc(patientName(pid))) + '<div class="form">' +
      '<div class="info">יתרה פתוחה: <span class="num">' + money(total) + "</span> על " + plural(open.length, "פגישה אחת", "פגישות") + "</div>" +
      '<div class="field"><span class="lab">אמצעי תשלום</span>' + segHTML("y-method", methodItems(false), "credit") + "</div>" +
      '<div class="fr"><div class="field"><label for="y-amount">סכום (₪)</label><input id="y-amount" type="number" min="0" step="10" inputmode="numeric" value="' + total + '"></div>' +
      '<div class="field"><label for="y-date">תאריך תשלום</label><input id="y-date" type="date" value="' + todayISO() + '"></div>' +
      '<div class="field"><label for="y-receipt">מספר קבלה</label><input id="y-receipt" placeholder="לא חובה"></div></div>' +
      '<p class="note">התשלום נזקף קודם לפגישות הוותיקות.</p>' +
      '<div id="y-err" class="banner" hidden></div></div>' +
      '<div class="dlg-f"><div class="end"><button type="button" class="btn" data-close>ביטול</button><button type="button" class="btn primary" id="y-save">רישום התשלום</button></div></div>';
    openDlg(html, () => {
      wireSeg("y-method");
      $("#y-save").addEventListener("click", async () => {
        let amount = Number($("#y-amount").value);
        const err = $("#y-err");
        if (!(amount > 0)) { err.textContent = "כתבי סכום גדול מאפס."; err.hidden = false; return; }
        if (amount > total) { err.textContent = "הסכום גבוה מהיתרה (" + money(total) + "). מקדמה לפגישה עתידית רושמים בפגישה עצמה."; err.hidden = false; return; }
        $("#y-save").disabled = true;
        const method = segVal("y-method"), date = $("#y-date").value || todayISO(), receipt = $("#y-receipt").value.trim();
        try {
          for (const s of open) {
            if (amount <= 0) break;
            const part = Math.min(amount, balOf(s));
            const payments = (s.payments || []).map((x) => Object.assign({}, x)).concat([{ amount: part, method, date, receipt }]);
            await updDoc("sessions", s.id, { payments });
            amount -= part;
          }
          closeDlg(); toast("התשלום נרשם");
        } catch (e) { $("#y-save").disabled = false; }
      });
    });
  }

  // ---------- export ----------
  function csv(rows) { return "﻿" + rows.map((r) => r.map((c) => { const s = String(c == null ? "" : c); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); }
  function inRange(iso, range) { if (!iso) return false; if (range === "all") return true; if (range === "year") return iso.slice(0, 4) === S.month.slice(0, 4); return ymOf(iso) === S.month; }
  async function doExport(kind) {
    const range = $("#exp-range").value;
    const tag = range === "all" ? "all" : range === "year" ? S.month.slice(0, 4) : S.month;
    let rows, name;
    if (kind === "payments") {
      rows = [["תאריך תשלום", "מטופלת", "סכום", "אמצעי תשלום", "מספר קבלה", "תאריך הפגישה", "הערה"]];
      const list = [];
      S.sessions.forEach((s) => (s.payments || []).forEach((p) => { if (inRange(p.date, range)) list.push([p.date, patientName(s.patientId), p.amount, mLabel(p.method), p.receipt || "", s.date, s.note || ""]); }));
      list.sort((a, b) => (a[0] < b[0] ? -1 : 1)).forEach((r) => { r[0] = fmtDate(r[0]); r[5] = fmtDate(r[5]); rows.push(r); });
      name = "payments-" + tag + ".csv";
    } else {
      rows = [["תאריך", "מטופלת", "סטטוס", "חיוב", "שולם", "יתרה", "אמצעי תשלום", "מספרי קבלה", "הערה"]];
      sortedSessions().reverse().filter((s) => inRange(s.date, range)).forEach((s) => {
        rows.push([fmtDate(s.date), patientName(s.patientId), STATUS[s.status], charge(s), paidOf(s), balOf(s), Array.from(new Set((s.payments || []).map((p) => mLabel(p.method)))).join(" + "), (s.payments || []).map((p) => p.receipt).filter(Boolean).join(" "), s.note || ""]);
      });
      name = "sessions-" + tag + ".csv";
    }
    if (rows.length === 1) { toast("אין נתונים בטווח שבחרת."); return; }
    try { await S.downloads.save({ filename: name, data: csv(rows) }); toast("הקובץ נשמר"); }
    catch (e) { if (e && e.code === "declined") return; toast("ההורדה לא הצליחה. נסי שוב בעוד רגע."); }
  }

  // ---------- events ----------
  $("#m-prev").addEventListener("click", () => { S.month = addMonths(S.month, -1); render(); });
  $("#m-next").addEventListener("click", () => { S.month = addMonths(S.month, 1); render(); });
  $("#add-session").addEventListener("click", () => { if (S.ready) openSession(null); });
  $$(".tabs button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { localStorage.setItem("gvia-tab", S.tab); } catch (e) { /* ignore */ } render(); }));

  $("#view").addEventListener("click", async (e) => {
    const t = e.target;
    const qp = t.closest("[data-qp]"); if (qp) { quickPay(qp.dataset.qp, qp.dataset.m); return; }
    const pp = t.closest("[data-pay-patient]"); if (pp) { openPayPatient(pp.dataset.payPatient); return; }
    const op = t.closest("[data-open-patient]"); if (op) { openPatient(op.dataset.openPatient); return; }
    const ed = t.closest("[data-edit]"); if (ed) { openSession(ed.dataset.edit); return; }
    const nd = t.closest("[data-new-day]"); if (nd) { openSession(null, S.patientFilter, nd.dataset.newDay); return; }
    const dy = t.closest("[data-day]"); if (dy) { S.selDay = dy.dataset.day; render(); return; }
    const f = t.closest("[data-filter]"); if (f) { S.filter = f.dataset.filter; render(); return; }
    const pf = t.closest("[data-pfilter]"); if (pf) { S.pFilter = pf.dataset.pfilter; render(); return; }
    const sv = t.closest("[data-sview]"); if (sv) { S.sview = sv.dataset.sview; try { localStorage.setItem("gvia-sview", S.sview); } catch (err) { /* ignore */ } render(); return; }
    if (t.closest("#clear-pf")) { S.patientFilter = ""; render(); return; }
    if (t.closest("[data-new-session]")) { openSession(null); return; }
    if (t.closest("#add-patient")) { openPatientEdit(null); return; }
    if (t.closest("#exp-payments")) { doExport("payments"); return; }
    if (t.closest("#exp-sessions")) { doExport("sessions"); return; }
    if (t.closest("#save-settings")) {
      const price = Number($("#set-price").value);
      if (!(price >= 0)) { toast("המחיר צריך להיות מספר."); return; }
      try { await queueWrite("settings/main", () => S.db.doc("settings/main").set({ clinicName: $("#set-name").value.trim(), defaultPrice: price })).catch(writeErr); toast("ההגדרות נשמרו"); } catch (err) { /* reported */ }
      return;
    }
    const ce = t.closest("#clear-examples");
    if (ce) { ce.outerHTML = '<div class="confirm">למחוק את כל נתוני הדוגמה? הנתונים שלך לא יימחקו. <button type="button" class="btn small danger" id="clear-examples2">כן, למחוק</button></div>'; return; }
    if (t.closest("#clear-examples2")) {
      try {
        for (const s of Array.from(S.sessions.values()).filter((x) => x.example)) await delDoc("sessions", s.id);
        for (const p of Array.from(S.patients.values()).filter((x) => x.example)) await delDoc("patients", p.id);
        toast("נתוני הדוגמה נמחקו");
      } catch (err) { /* reported */ }
    }
  });
  $("#view").addEventListener("change", (e) => {
    if (e.target.id === "s-patient") { S.patientFilter = e.target.value; render(); }
  });
  $("#view").addEventListener("input", (e) => {
    if (e.target.id !== "p-search") return;
    S.pSearch = e.target.value;
    const all = Array.from(S.patients.values()).sort((a, b) => (a.active === b.active ? a.name.localeCompare(b.name, "he") : a.active ? -1 : 1));
    const box = $("#pts-body"); if (box) box.innerHTML = patientsTable(all, new Map(all.map((p) => [p.id, patientSummary(p.id)])));
  });
  $("#view").addEventListener("keydown", (e) => {
    const d = e.target.closest && e.target.closest("[data-day]");
    if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.selDay = d.dataset.day; render(); const el = $('[data-day="' + S.selDay + '"]'); if (el) el.focus(); }
  });
  // actions inside the patient dialog's session list
  body.addEventListener("click", (e) => {
    if (!e.target.closest("#pp-rows")) return;
    const qp = e.target.closest("[data-qp]");
    if (qp) { quickPay(qp.dataset.qp, qp.dataset.m); closeDlg(); return; }
    const ed = e.target.closest("[data-edit]"); if (ed) openSession(ed.dataset.edit);
  });

  function applyWriteMode() {
    $("#app").classList.toggle("readonly", !S.canWrite);
    body.classList.toggle("readonly", !S.canWrite);
    const b = $("#banner");
    b.hidden = S.canWrite;
    b.textContent = "מצב צפייה בלבד: אפשר לראות את הנתונים, אבל לא לשנות אותם.";
  }

  // ---------- boot ----------
  render();
  (async () => {
    const api = window.claude && window.claude.use ? window.claude : null;
    if (!api) { S.noDb = true; render(); return; }
    const [db, user, downloads] = await Promise.all([api.use("db"), api.use("user"), api.use("downloads")]);
    S.downloads = downloads;
    if (!db) { S.noDb = true; render(); return; }
    S.db = db;
    if (user) { const can = await user.can("data.write"); if (can === false) { S.canWrite = false; applyWriteMode(); } }
    const got = { p: false, s: false, c: false };
    const mark = (k) => { got[k] = true; if (got.p && got.s && got.c) S.ready = true; render(); };
    const onErr = () => { toast("החיבור לנתונים נקטע. רענני את הדף."); };
    db.doc("settings/main").onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : {};
      S.settings = { clinicName: d.clinicName || "", defaultPrice: d.defaultPrice != null ? d.defaultPrice : 400 };
      mark("c");
    }, onErr);
    db.collection("patients").onSnapshot((snap) => {
      S.patients = new Map(snap.docs.map((d) => [d.id, Object.assign({ id: d.id, phone: "", note: "", active: true }, d.data())]));
      mark("p");
    }, onErr);
    db.collection("sessions").onSnapshot((snap) => {
      S.sessions = new Map(snap.docs.map((d) => [d.id, Object.assign({ id: d.id, payments: [], status: "held", note: "" }, d.data())]));
      mark("s");
    }, onErr);
  })();
})();
</script>
