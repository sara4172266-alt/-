  }

  // ---------- dialogs ----------
  const dlg = $("#dlg"), body = $("#dlg-body");
  function openDlg(html, wire) { S.dayDlg = ""; dlg.classList.remove("wide"); body.innerHTML = html; if (!dlg.open) dlg.showModal(); body.scrollTop = 0; wire && wire(); }
  function closeDlg() { if (dlg.open) dlg.close(); S.dayDlg = ""; dlg.classList.remove("wide"); }
  dlg.addEventListener("close", () => { S.dayDlg = ""; dlg.classList.remove("wide"); });
  dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDlg(); });
  const dlgHead = (t) => '<div class="dlg-h"><h2>' + t + '</h2><button type="button" class="x" data-close aria-label="סגירה">×</button></div>';
  body.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeDlg(); });

  function segHTML(id, items, val) {
    return '<div class="seg" id="' + id + '">' + items.map((it) => '<button type="button" data-v="' + it.v + '" aria-pressed="' + (it.v === val) + '">' + (it.i ? icon(it.i) : "") + it.l + "</button>").join("") + "</div>";
  }
  function wireSeg(id, onChange) {
    const el = $("#" + id);
    el.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      $$("button", el).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      onChange && onChange(b.dataset.v);
    });
  }
  const segVal = (id) => { const b = $("#" + id + ' button[aria-pressed="true"]'); return b ? b.dataset.v : null; };
  const methodItems = (withNone) => (withNone ? [{ v: "none", l: "טרם שולם" }] : []).concat(METHOD_KEYS.map((k) => ({ v: k, l: METHODS[k].label, i: METHODS[k].icon })));

  function patientOptions(selected) {
    const ps = Array.from(S.patients.values()).filter((p) => p.active || p.id === selected).sort((a, b) => a.name.localeCompare(b.name, "he"));
    return '<option value="">בחרי מטופלת…</option>' + ps.map((p) => '<option value="' + esc(p.id) + '"' + (p.id === selected ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + '<option value="__new">+ מטופלת חדשה…</option>';
  }

  function openSession(sid, presetPatient, presetDate, presetTime, opts) {
    const existing = sid ? S.sessions.get(sid) : null;
    const laterSeries = existing && existing.seriesId ? Array.from(S.sessions.values()).filter((x) => x.seriesId === existing.seriesId && x.date > existing.date && x.id !== existing.id) : [];
    const s = existing ? plain(existing) : { patientId: presetPatient || "", date: presetDate || (S.month === ymOf(todayISO()) ? todayISO() : S.month + "-01"), price: Number(S.settings.defaultPrice) || 400, time: presetTime || "", duration: Number(S.settings.sessionLength) || 50, status: "held", note: "", payments: [] };
    const payments = (s.payments || []).slice();
    const ro = !S.canWrite;
    const html = dlgHead(existing ? "עריכת פגישה" : "פגישה חדשה") +
      '<div class="form">' +
      '<div class="field"><label for="f-patient">מטופלת</label><select id="f-patient">' + patientOptions(s.patientId) + "</select></div>" +
      '<div class="field" id="f-newp-wrap" hidden><label for="f-newp">שם המטופלת החדשה</label><input id="f-newp" placeholder="שם מלא"></div>' +
      '<div class="fr"><div class="field"><label for="f-date">תאריך הפגישה</label><input id="f-date" type="date" value="' + esc(s.date) + '"><span class="sub" id="f-hdate"></span></div>' +
      '<div class="field"><label for="f-time">שעה</label><input id="f-time" type="time" step="300" value="' + esc(s.time || "") + '"></div>' +
      '<div class="field"><label for="f-dur">משך (דקות)</label><input id="f-dur" type="number" min="5" step="5" inputmode="numeric" value="' + esc(s.duration || durOf(s)) + '"></div>' +
      '<div class="field"><label for="f-price">מחיר (₪)</label><input id="f-price" type="number" min="0" step="10" inputmode="numeric" value="' + esc(s.price) + '"></div></div>' +
      '<div id="f-warn" class="warnbox" hidden></div>' +
      (existing ? (existing.seriesId ? '<div class="section"><span class="rep">↻ פגישה קבועה</span>' + (laterSeries.length && !ro ? '<div class="field"><span class="lab">לשמור את השינויים (שעה, משך, מחיר, מטופלת ויום בשבוע):</span>' + segHTML("f-scope", [{ v: "one", l: "רק בפגישה הזו" }, { v: "all", l: "גם ב-" + laterSeries.length + " הפגישות הבאות" }], "one") + "</div>" : '<p class="note">זו הפגישה האחרונה בסדרה.</p>') + "</div>" : "") :
        '<div class="section"><label class="check"><input type="checkbox" id="f-rep"' + (opts && opts.repeat ? " checked" : "") + '> <span>פגישה קבועה (חוזרת)</span></label>' +
        '<div class="fr" id="f-rep-opts"' + (opts && opts.repeat ? "" : " hidden") + '><div class="field"><label for="f-freq">תדירות</label><select id="f-freq"><option value="7">כל שבוע</option><option value="14">כל שבועיים</option></select></div>' +
        '<div class="field"><label for="f-until">עד תאריך</label><input id="f-until" type="date"></div></div>' +
        '<label class="check" id="f-skip-wrap"' + (opts && opts.repeat ? "" : " hidden") + '><input type="checkbox" id="f-skip" checked> <span id="f-skip-l">לדלג על שבתות וימים טובים</span></label>' +
        '<p class="note" id="f-rep-sum"' + (opts && opts.repeat ? "" : " hidden") + "></p></div>") +
      '<div class="field"><span class="lab">סטטוס</span>' + segHTML("f-status", [{ v: "held", l: STATUS.held }, { v: "late", l: STATUS.late }, { v: "free", l: STATUS.free }], s.status) + "</div>" +
      '<div class="section"><h3>תשלום</h3><div class="paylist" id="f-paylist"></div>' +
      '<div id="f-newpay" class="form"><div class="field"><span class="lab" id="f-newpay-lab">איך שולם?</span>' + segHTML("f-method", methodItems(true), "none") + "</div>" +
      '<div class="fr" id="f-paydetails" hidden><div class="field"><label for="f-amount">סכום (₪)</label><input id="f-amount" type="number" min="0" step="10" inputmode="numeric"></div>' +
      '<div class="field"><label for="f-paydate">תאריך תשלום</label><input id="f-paydate" type="date" value="' + todayISO() + '"></div>' +
      '<div class="field"><label for="f-receipt">מספר קבלה</label><input id="f-receipt" placeholder="לא חובה"></div></div></div></div>' +
      '<div class="field"><label for="f-note">הערה</label><textarea id="f-note" placeholder="לא חובה">' + esc(s.note) + "</textarea></div>" +
      '<div id="f-err" class="banner" hidden></div>' +
      "</div>" +
      '<div class="dlg-f">' + (existing && !ro ? '<button type="button" class="btn danger" id="f-del">מחיקת הפגישה</button>' : "") +
      '<div class="end"><button type="button" class="btn" ' + (opts && opts.returnDay ? 'data-back-day="' + opts.returnDay + '">חזרה ליום' : "data-close>ביטול") + "</button>" + (ro ? "" : (existing ? "" : '<button type="button" class="btn" id="f-save-next">שמירה והוספת עוד</button>') + '<button type="button" class="btn primary" id="f-save">שמירה</button>') + "</div></div>";

    openDlg(html, () => {
      const curCharge = () => (segVal("f-status") === "free" ? 0 : Number($("#f-price").value) || 0);
      const paidSoFar = () => payments.reduce((a, p) => a + (Number(p.amount) || 0), 0);
      const drawPays = () => {
        $("#f-paylist").innerHTML = payments.map((p, i) => '<div class="payrow"><span class="via">' + (METHODS[p.method] ? icon(METHODS[p.method].icon) : "") + esc(mLabel(p.method)) + '</span><b class="num">' + money(p.amount) + '</b><span class="grow">' + fullDate(p.date) + (p.receipt ? " · קבלה " + esc(p.receipt) : "") + "</span>" + (ro ? "" : '<button type="button" class="btn small danger" data-rmpay="' + i + '">הסרה</button>') + "</div>").join("");
        const rest = Math.max(0, curCharge() - paidSoFar());
        $("#f-newpay-lab").textContent = payments.length ? (rest > 0 ? "תשלום נוסף (נותרו " + money(rest) + ")" : "תשלום נוסף") : "איך שולם?";
        if (segVal("f-method") !== "none" && !$("#f-amount").dataset.touched) $("#f-amount").value = rest || "";
      };
      drawPays();
      $("#f-paylist").addEventListener("click", (e) => { const b = e.target.closest("[data-rmpay]"); if (!b) return; payments.splice(Number(b.dataset.rmpay), 1); drawPays(); });
      wireSeg("f-status", drawPays);
      wireSeg("f-method", (v) => { $("#f-paydetails").hidden = v === "none"; drawPays(); });
      $("#f-amount").addEventListener("input", (e) => { e.target.dataset.touched = "1"; });
      $("#f-price").addEventListener("input", drawPays);
      const showHeb = () => { const v = $("#f-date").value; const hb = /^\d{4}-\d{2}-\d{2}$/.test(v) ? heb(v) : null; $("#f-hdate").textContent = hb && hb.month ? weekday(v) + " · " + hebFull(v) : ""; };
      showHeb(); $("#f-date").addEventListener("input", showHeb);
      const repDates = () => {
        const d0 = $("#f-date").value, until = $("#f-until").value, step = Number($("#f-freq").value) || 7;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d0) || !/^\d{4}-\d{2}-\d{2}$/.test(until) || until < d0) return [];
        const out = []; for (let d = d0; d <= until && out.length < 60; d = addDays(d, step)) out.push(d);
        return out;
      };
      const repFinal = () => { const ds = repDates(); return $("#f-skip") && $("#f-skip").checked ? ds.filter((d) => !isRest(d)) : ds; };
      const checkWarn = () => {
        const w = $("#f-warn"), msgs = [];
        const d0 = $("#f-date").value, t0 = timeOf({ time: $("#f-time").value }), dur = Number($("#f-dur").value) || durOf({});
        const repOn = $("#f-rep") && $("#f-rep").checked;
        if (/^\d{4}-\d{2}-\d{2}$/.test(d0)) {
          if (!repOn) {
            if (isRest(d0)) msgs.push("שימי לב: " + fmtDate(d0) + " הוא " + restName(d0) + ".");
            else { const hs = holidays(d0).filter((x) => x.kind !== "rc"); if (hs.length) msgs.push("באותו יום: " + hs.map((x) => x.name).join(", ") + "."); }
            if (t0 != null) { const ov = overlaps(d0, t0, dur, sid ? [sid] : []); if (ov.length) msgs.push("באותה שעה כבר קבועה פגישה: " + ov.map((x) => patientName(x.patientId) + " " + x.time).join(", ") + "."); }
          } else {
            const ds = repFinal();
            if (t0 != null) { const c = ds.filter((d) => overlaps(d, t0, dur, []).length).length; if (c) msgs.push("ב-" + plural(c, "תאריך אחד", "תאריכים") + " מהסדרה כבר יש פגישה באותה שעה."); }
            const fasts = ds.filter((d) => holidays(d).some((x) => x.kind === "chol" || x.kind === "fast" || x.kind === "erev"));
            if (fasts.length) msgs.push("תאריכים שנופלים בחול המועד, בערב חג או בצום: " + fasts.map(fmtDate).join(", ") + ".");
          }
        }
        w.innerHTML = msgs.map((m) => "<span>" + esc(m) + "</span>").join("");
        w.hidden = !msgs.length;
      };
      checkWarn();
      ["f-date", "f-time", "f-dur"].forEach((id) => $("#" + id).addEventListener("input", checkWarn));
      const repSum = () => {
        checkWarn();
        if (!$("#f-rep") || !$("#f-rep").checked) return;
        const all = repDates(), ds = repFinal(), tm = $("#f-time").value;
        const skipped = all.filter((d) => isRest(d));
        $("#f-skip-l").textContent = "לדלג על שבתות וימים טובים" + (skipped.length ? " (" + skipped.map((d) => restName(d) + " " + fmtDate(d)).join(", ") + ")" : "");
        $("#f-rep-sum").textContent = ds.length ? "ייווצרו " + ds.length + " פגישות: " + ($("#f-freq").value === "14" ? "כל שבועיים" : "כל שבוע") + " ב" + weekday(ds[0]) + (tm ? " בשעה " + tm : "") + ", מ-" + fullDate(ds[0]) + " עד " + fullDate(ds[ds.length - 1]) + "." : all.length ? "כל התאריכים בסדרה נופלים בשבת או ביום טוב. בחרי יום אחר בשבוע." : "בחרי תאריך סיום מאוחר מתאריך הפגישה.";
      };
      if ($("#f-rep")) {
        const setUntil = () => { const v = $("#f-date").value; if (/^\d{4}-\d{2}-\d{2}$/.test(v) && !$("#f-until").dataset.touched) $("#f-until").value = addDays(v, 7 * 12); };
        setUntil();
        $("#f-rep").addEventListener("change", (e) => { $("#f-rep-opts").hidden = !e.target.checked; $("#f-rep-sum").hidden = !e.target.checked; $("#f-skip-wrap").hidden = !e.target.checked; repSum(); });
        $("#f-skip").addEventListener("change", repSum);
        $("#f-until").addEventListener("input", (e) => { e.target.dataset.touched = "1"; repSum(); });
        $("#f-freq").addEventListener("change", repSum);
        $("#f-date").addEventListener("input", () => { setUntil(); repSum(); });
        $("#f-time").addEventListener("input", repSum);
        repSum();
      }
      if ($("#f-scope")) wireSeg("f-scope");
      $("#f-patient").addEventListener("change", (e) => { $("#f-newp-wrap").hidden = e.target.value !== "__new"; if (e.target.value === "__new") $("#f-newp").focus(); });
      if (ro) { $$("input,select,textarea", body).forEach((x) => (x.disabled = true)); $("#f-newpay").hidden = true; return; }
      const del = $("#f-del");
      if (del) del.addEventListener("click", () => {
        const later = existing.seriesId ? Array.from(S.sessions.values()).filter((x) => x.seriesId === existing.seriesId && x.date > existing.date && paidOf(x) === 0) : [];
        del.outerHTML = '<div class="confirm">למחוק את הפגישה לצמיתות? <button type="button" class="btn small danger" id="f-del2">רק את הפגישה הזו</button>' + (later.length ? '<button type="button" class="btn small danger" id="f-del3">גם את ' + later.length + " הפגישות הבאות בסדרה</button>" : "") + "</div>";
        const copy = plain(existing);
        $("#f-del2").addEventListener("click", () => { delDoc("sessions", sid).then(() => { closeDlg(); toast("הפגישה נמחקה", () => setDoc("sessions", sid, copy)); if (opts && opts.returnDay) openDay(opts.returnDay); }, () => {}); });
        const d3 = $("#f-del3");
        if (d3) d3.addEventListener("click", async () => {
          const copies = [[sid, copy]].concat(later.map((x) => [x.id, plain(x)]));
          try {
            await delDoc("sessions", sid); for (const x of later) await delDoc("sessions", x.id);
            closeDlg();
            toast("נמחקו " + (later.length + 1) + " פגישות", async () => { for (const [id, c] of copies) await setDoc("sessions", id, c); });
          } catch (e) { /* reported */ }
        });
      });
      const doSave = async (next) => {
        const err = $("#f-err"); err.hidden = true;
        const fail = (m) => { err.textContent = m; err.hidden = false; };
        let pid = $("#f-patient").value;
        const date = $("#f-date").value, price = Number($("#f-price").value);
        if (!pid) return fail("בחרי מטופלת.");
        if (pid === "__new" && !$("#f-newp").value.trim()) return fail("כתבי את שם המטופלת החדשה.");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail("בחרי תאריך לפגישה.");
        if (!(price >= 0)) return fail("המחיר צריך להיות מספר.");
        const m = segVal("f-method");
        const finalPays = payments.slice();
        if (m && m !== "none") {
          const amount = Number($("#f-amount").value);
          if (!(amount > 0)) return fail("כתבי את סכום התשלום.");
          finalPays.push({ amount, method: m, date: $("#f-paydate").value || todayISO(), receipt: $("#f-receipt").value.trim() });
        }
        $("#f-save").disabled = true;
        try {
          if (pid === "__new") {
            const npid = newId("patients");
            await setDoc("patients", npid, { name: $("#f-newp").value.trim(), phone: "", note: "", active: true, createdAt: todayISO() });
            pid = npid;
          }
          const data = Object.assign({}, existing ? plain(existing) : { createdAt: todayISO() }, { patientId: pid, date, price, status: segVal("f-status"), time: $("#f-time").value || "", duration: Number($("#f-dur").value) || durOf({}), note: $("#f-note").value.trim(), payments: finalPays });
          const rep = !existing && $("#f-rep") && $("#f-rep").checked ? repFinal() : [];
          if (rep.length > 1) {
            const seriesId = newId("sessions");
            for (let i = 0; i < rep.length; i++) {
              await setDoc("sessions", newId("sessions"), Object.assign({}, data, { date: rep[i], seriesId, payments: i === 0 ? finalPays : [] }));
            }
            closeDlg();
            toast("נוספו " + rep.length + " פגישות קבועות");
          } else {
            await setDoc("sessions", sid || newId("sessions"), data);
            let more = 0;
            if (existing && laterSeries.length && segVal("f-scope") === "all") {
              const delta = Math.round((Date.UTC(...date.split("-").map((x, i) => Number(x) - (i === 1 ? 1 : 0))) - Date.UTC(...existing.date.split("-").map((x, i) => Number(x) - (i === 1 ? 1 : 0)))) / 864e5);
              for (const x of laterSeries) {
                await updDoc("sessions", x.id, { patientId: pid, price, time: data.time, duration: data.duration, date: addDays(x.date, delta) });
                more++;
              }
            }
            closeDlg();
            toast(existing ? (more ? "עודכנו הפגישה ועוד " + more + " פגישות בסדרה" : "הפגישה עודכנה") : "הפגישה נוספה");
          }
          if (!existing) { S.selDay = date; S.month = ymOf(date); if (date < S.weekStart || date > addDays(S.weekStart, 6)) S.weekStart = sundayOf(date); render(); }
          if (next) { const t0 = timeOf({ time: data.time }); openSession(null, "", date, t0 != null ? fmtT(t0 + data.duration) : "", opts && opts.returnDay ? { returnDay: date } : null); }
          else if (opts && opts.returnDay) openDay(opts.returnDay);
        } catch (e) { $("#f-save").disabled = false; }
      };
      $("#f-save").addEventListener("click", () => doSave(false));
      const sn = $("#f-save-next"); if (sn) sn.addEventListener("click", () => doSave(true));
    });
  }

  function openPatientEdit(pid) {
    const p = pid ? S.patients.get(pid) : null;
    const sm = pid ? patientSummary(pid) : { count: 0 };
    const html = dlgHead(p ? "פרטי מטופלת" : "מטופלת חדשה") + '<div class="form">' +
      '<div class="field"><label for="p-name">שם מלא</label><input id="p-name" value="' + esc(p ? p.name : "") + '"></div>' +
      '<div class="field"><label for="p-phone">טלפון</label><input id="p-phone" type="tel" dir="ltr" style="text-align:right" value="' + esc(p ? p.phone : "") + '"></div>' +
      '<div class="field"><label for="p-note">הערה</label><textarea id="p-note">' + esc(p ? p.note : "") + "</textarea></div>" +
      (p ? '<div class="field"><span class="lab">מצב</span>' + segHTML("p-active", [{ v: "1", l: "פעילה" }, { v: "0", l: "בארכיון (סיימה טיפול)" }], p.active ? "1" : "0") + "</div>" : "") +
      '<div id="p-err" class="banner" hidden></div></div>' +
      '<div class="dlg-f">' + (p && sm.count === 0 ? '<button type="button" class="btn danger" id="p-del">מחיקה</button>' : "") +

        const pcopy = Object.assign({}, p); delete pcopy.id;
        $("#p-del2").addEventListener("click", () => delDoc("patients", pid).then(() => { closeDlg(); toast("המטופלת נמחקה", () => setDoc("patients", pid, pcopy)); }, () => {}));
      });
      $("#p-save").addEventListener("click", async () => {
        const name = $("#p-name").value.trim();
        if (!name) { $("#p-err").textContent = "כתבי את שם המטופלת."; $("#p-err").hidden = false; return; }
        const data = Object.assign({}, p ? { createdAt: p.createdAt || todayISO() } : { createdAt: todayISO() }, { name, phone: $("#p-phone").value.trim(), note: $("#p-note").value.trim(), active: p ? segVal("p-active") === "1" : true });
        if (p && p.example) data.example = true;
        $("#p-save").disabled = true;
        try { await setDoc("patients", pid || newId("patients"), data); closeDlg(); toast(p ? "הפרטים נשמרו" : "המטופלת נוספה"); }
        catch (e) { $("#p-save").disabled = false; }
      });
    });
  }

  function openPatient(pid) {

  function openPayPatient(pid) {

      '<div class="field"><label for="y-receipt">מספר קבלה</label><input id="y-receipt" placeholder="לא חובה"></div></div>' +

      '<div class="dlg-f"><div class="end"><button type="button" class="btn" data-close>ביטול</button><button type="button" class="btn primary" id="y-save">רישום התשלום</button></div></div>';

  // ---------- Jewish holidays ----------
  let hebEnFmt = null;
  try { hebEnFmt = new Intl.DateTimeFormat("en-u-ca-hebrew", { day: "numeric", month: "long" }); } catch (e) { /* no Hebrew calendar */ }
  const hmCache = new Map();
  function hm(iso) {
    let r = hmCache.get(iso); if (r) return r;
    r = { m: "", d: 0 };
    if (hebEnFmt) {
      const [y, mo, d] = iso.split("-").map(Number);
      const parts = hebEnFmt.formatToParts(new Date(y, mo - 1, d, 12));
      r = { m: (parts.find((p) => p.type === "month") || {}).value || "", d: Number((parts.find((p) => p.type === "day") || {}).value) || 0 };
    }
    hmCache.set(iso, r);
    return r;
  }
  const holCache = new Map();
  // kind: yt = יום טוב (no sessions), chol, fast, minor, rc = ראש חודש, erev
  function holidays(iso) {
    let r = holCache.get(iso); if (r) return r;
    r = [];
    const { m, d } = hm(iso), w = dow(iso);
    const add = (name, kind) => r.push({ name, kind });
    if (m) {
      if (m === "Elul" && d === 29) add("ערב ראש השנה", "erev");
      if (m === "Tishri") {
        if (d === 1 || d === 2) add("ראש השנה", "yt");
        if ((d === 3 && w !== 6) || (d === 4 && w === 0)) add("צום גדליה", "fast");
        if (d === 9) add("ערב יום כיפור", "erev");
        if (d === 10) add("יום כיפור", "yt");
        if (d === 14) add("ערב סוכות", "erev");
        if (d === 15) add("סוכות", "yt");
        if (d >= 16 && d <= 20) add("חול המועד סוכות", "chol");
        if (d === 21) add("הושענא רבה", "chol");
        if (d === 22) add("שמחת תורה", "yt");
      }
      if (m === "Tevet" && d === 10) add("עשרה בטבת", "fast");
      if (m === "Shevat" && d === 15) add("ט״ו בשבט", "minor");
      if (m === "Kislev" && d === 24) add("ערב חנוכה", "erev");
      if (m === "Adar I") { if (d === 14) add("פורים קטן", "minor"); if (d === 15) add("שושן פורים קטן", "minor"); }
      if (m === "Adar" || m === "Adar II") {
        if ((d === 13 && w !== 6) || (d === 11 && w === 4)) add("תענית אסתר", "fast");
        if (d === 13) add("ערב פורים", "erev");
        if (d === 14) add("פורים", "minor");
        if (d === 15) add("שושן פורים", "minor");
      }
      if (m === "Nisan") {
        if ((d === 14 && w !== 6) || (d === 12 && w === 4)) add("תענית בכורות", "fast");
        if (d === 14) add("ערב פסח", "erev");
        if (d === 15) add("פסח", "yt");
        if (d >= 16 && d <= 20) add("חול המועד פסח", "chol");
        if (d === 21) add("שביעי של פסח", "yt");
      }
      if (m === "Iyar" && d === 14) add("פסח שני", "minor");
      if (m === "Iyar" && d === 18) add("ל״ג בעומר", "minor");
      if (m === "Sivan") { if (d === 5) add("ערב שבועות", "erev"); if (d === 6) add("שבועות", "yt"); }
      if (m === "Tamuz" && ((d === 17 && w !== 6) || (d === 18 && w === 0))) add("י״ז בתמוז", "fast");
      if (m === "Av" && ((d === 8 && w !== 5) || (d === 9 && w === 6))) add("ערב תשעה באב", "erev");
      if (m === "Av" && ((d === 9 && w !== 6) || (d === 10 && w === 0))) add("תשעה באב", "fast");
      if (m === "Av" && d === 15) add("ט״ו באב", "minor");
      if ((d === 1 && m !== "Tishri") || d === 30) add("ראש חודש", "rc");
      for (let k = 0; k < 8; k++) { const x = hm(addDays(iso, -k)); if (x.m === "Kislev" && x.d === 25) { add("חנוכה · יום " + (k + 1), "minor"); break; } }
    }
    holCache.set(iso, r);
    return r;
  }
  const isRest = (iso) => dow(iso) === 6 || holidays(iso).some((h) => h.kind === "yt");
  const restName = (iso) => { const yt = holidays(iso).find((h) => h.kind === "yt"); return yt ? yt.name : dow(iso) === 6 ? "שבת" : ""; };
  const holChips = (iso) => { const hs = holidays(iso); return hs.length ? '<span class="hols">' + hs.map((h) => '<span class="hol ' + h.kind + '">' + h.name + "</span>").join("") + "</span>" : ""; };
  const holLine = (iso) => { const hs = holidays(iso); return hs.length ? '<span class="holm ' + hs[0].kind + '">' + hs.map((h) => h.name).join(" · ") + "</span>" : ""; };

  function overlaps(date, startMin, dur, excludeIds) {
    const ex = new Set([].concat(excludeIds || []));
    return Array.from(S.sessions.values()).filter((x) => {
      if (x.date !== date || ex.has(x.id) || x.status === "free") return false;
      const t = timeOf(x); if (t == null) return false;
      return t < startMin + dur && startMin < t + durOf(x);
    });
  }

      '<div class="sub">' + esc(weekday(s.date)) + ", " + fmtDate(s.date) + (t != null ? ' · <bdi dir="ltr">' + fmtT(t) + "–" + fmtT(t + durOf(s)) + "</bdi>" : "") + "</div>" +

      '<div class="pop-r"><span class="st ' + st.cls + '">' + st.label + (s.status !== "held" ? " · " + STATUS[s.status] : "") + '</span><span class="amt">' + money(charge(s)) + (paidOf(s) > 0 && bal > 0 ? ' <span class="sub" style="color:var(--bad)">נותרו ' + money(bal) + "</span>" : "") + "</span></div>" +
      (bal > 0 && S.canWrite ? '<div class="pop-pay"><span class="sub">סימון תשלום מלא:</span><div class="pay">' + METHOD_KEYS.map((k) => '<button type="button" class="qp" data-pop-qp="' + esc(s.id) + '" data-m="' + k + '">' + icon(METHODS[k].icon) + mLabel(k, true) + "</button>").join("") + "</div></div>" : "") +
      (s.note ? '<p class="note">' + esc(s.note) + "</p>" : "") +
      '<div class="pop-f"><button type="button" class="btn small" data-pop-edit="' + esc(s.id) + '">' + (S.canWrite ? "עריכה מלאה" : "פרטים") + "</button>" +
      (bal > 0 && !isFuture(s) ? '<button type="button" class="btn small write-only" data-pop-remind="' + esc(s.patientId) + '">תזכורת תשלום</button>' : "") +
      '<button type="button" class="btn small" data-pop-patient="' + esc(s.patientId) + '">כרטיס מטופלת</button></div>';
    pop.hidden = false; popFor = id;
    const r = anchor.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    if (vw < 560) { pop.classList.add("sheet"); pop.style.left = pop.style.top = ""; }
    else {
      pop.classList.remove("sheet");
      const w = pop.offsetWidth, h = pop.offsetHeight;
      let left = r.left + r.width / 2 - w / 2; left = Math.max(8, Math.min(left, vw - w - 8));
      let top = r.bottom + 6; if (top + h > vh - 8) top = Math.max(8, r.top - h - 6);
      pop.style.left = left + "px"; pop.style.top = top + "px";
    }
    const first = pop.querySelector(".qp, .btn"); if (first) first.focus({ preventScroll: true });
  }
  pop.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-pop-close]")) { closePop(); return; }
    const q = t.closest("[data-pop-qp]"); if (q) { closePop(); quickPay(q.dataset.popQp, q.dataset.m); return; }
    const ed = t.closest("[data-pop-edit]"); if (ed) { closePop(); openSession(ed.dataset.popEdit); return; }
    const rm = t.closest("[data-pop-remind]"); if (rm) { closePop(); openReminder(rm.dataset.popRemind); return; }
    const pt = t.closest("[data-pop-patient]"); if (pt) { closePop(); openPatient(pt.dataset.popPatient); return; }
  });
  document.addEventListener("pointerdown", (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("[data-ev]")) closePop(); }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePop(); hideSearch(); } });
  window.addEventListener("scroll", () => { if (!pop.classList.contains("sheet")) closePop(); }, { passive: true });
  window.addEventListener("resize", closePop);

  // ---------- drag sessions in the week grid (mouse / pen) ----------
  let drag = null, suppressClick = false;
  $("#view").addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".we[data-ev]");
    if (!el || e.pointerType === "touch" || e.button !== 0 || !S.canWrite) return;
    const s = S.sessions.get(el.dataset.ev); const col = el.closest(".wk-col");
    if (!s || !col) return;
    const hh = col.getBoundingClientRect().height / Number(col.dataset.hours);
    drag = { el, s, x: e.clientX, y: e.clientY, on: false, ghost: null, target: null, hh, off: ((e.clientY - el.getBoundingClientRect().top) / hh) * 60 };
    e.preventDefault();
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.on) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.on = true; closePop(); drag.el.classList.add("dragging"); document.body.classList.add("is-dragging");
    }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const col = under && under.closest(".wk-col"); if (!col) return;
    const r = col.getBoundingClientRect(), start = Number(col.dataset.start), dur = durOf(drag.s);
    let min = start * 60 + ((e.clientY - r.top) / drag.hh) * 60 - drag.off;
    min = Math.max(0, Math.min(Math.round(min / 15) * 15, 24 * 60 - dur));
    drag.target = { date: col.dataset.col, min };
    if (!drag.ghost) { drag.ghost = document.createElement("div"); drag.ghost.className = "we ghost"; }
    if (drag.ghost.parentNode !== col) col.appendChild(drag.ghost);
    drag.ghost.style.cssText = "top:calc(" + (min - start * 60) / 60 + " * var(--hh) + 1px);height:calc(" + dur / 60 + " * var(--hh) - 3px);inset-inline-start:2px;width:calc(100% - 4px)";
    drag.ghost.innerHTML = '<span class="wt"><bdi dir="ltr">' + fmtT(min) + "–" + fmtT(min + dur) + "</bdi></span><b>" + esc(patientName(drag.s.patientId)) + "</b>";
  });
  window.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null;
    document.body.classList.remove("is-dragging");
    if (!d.on) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
    if (d.ghost) d.ghost.remove();
    d.el.classList.remove("dragging");
    if (!d.target) return;
    const nt = fmtT(d.target.min);
    if (d.target.date === d.s.date && nt === d.s.time) return;
    const before = { date: d.s.date, time: d.s.time || "" };
    const ov = overlaps(d.target.date, d.target.min, durOf(d.s), d.s.id);
    const rest = isRest(d.target.date) ? restName(d.target.date) : "";
    updDoc("sessions", d.s.id, { date: d.target.date, time: nt }).then(() => {
      toast(patientName(d.s.patientId) + " הועברה ל" + weekday(d.target.date) + " " + fmtDate(d.target.date) + " בשעה " + nt +
        (ov.length ? ". שימי לב: חופף לפגישה עם " + ov.map((x) => patientName(x.patientId)).join(", ") : "") + (rest ? ". שימי לב: " + rest : ""),
        () => updDoc("sessions", d.s.id, before));
    }, () => {});
  });

  // ---------- quick search ----------

  gs.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const f = gres.querySelector("[data-g]"); if (f) { e.preventDefault(); gs.value = ""; hideSearch(); openPatient(f.dataset.g); } }
    if (e.key === "ArrowDown") { const f = gres.querySelector("[data-g]"); if (f) { e.preventDefault(); f.focus(); } }
  });
  gres.addEventListener("keydown", (e) => {
    const b = e.target.closest("[data-g]"); if (!b) return;
    if (e.key === "ArrowDown" && b.nextElementSibling) { e.preventDefault(); b.nextElementSibling.focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); (b.previousElementSibling || gs).focus(); }
  });
  gres.addEventListener("click", (e) => { const b = e.target.closest("[data-g]"); if (!b) return; gs.value = ""; hideSearch(); openPatient(b.dataset.g); });
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".gsearch")) hideSearch(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "") && !dlg.open) { e.preventDefault(); gs.focus(); }
  });

  // ---------- settings save, backup and restore ----------
  function saveSettings(patch) {
    const next = Object.assign({}, S.settings, patch);
    return queueWrite("settings/main", () => S.db.doc("settings/main").set(next)).catch(writeErr);
  }
  async function doBackup() {
    const data = {
      app: "gvia", version: 1, exportedAt: new Date().toISOString(),
      settings: Object.assign({}, S.settings),
      patients: Array.from(S.patients.values()).map((p) => Object.assign({}, p)),
      sessions: Array.from(S.sessions.values()).map((s) => Object.assign({ id: s.id }, plain(s))),
    };
    try {
      await S.downloads.save({ filename: "gvia-backup-" + todayISO() + ".json", data: JSON.stringify(data, null, 1) });
      toast("הגיבוי נשמר");
      saveSettings({ lastBackup: todayISO() }).catch(() => {});
    } catch (e) { if (e && e.code === "declined") return; toast("שמירת הגיבוי לא הצליחה. נסי שוב בעוד רגע."); }
  }
  let restoreData = null;
  function readRestore(file) {
    const box = $("#restore-box"); if (!box) return;
    const fr = new FileReader();
    fr.onload = () => {
      let d = null;
      try { d = JSON.parse(String(fr.result)); } catch (e) { d = null; }
      const okId = (x) => x && typeof x.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id) && x.id !== "." && x.id !== "..";
      if (!d || d.app !== "gvia" || !Array.isArray(d.patients) || !Array.isArray(d.sessions) || !d.patients.every(okId) || !d.sessions.every(okId)) {
        restoreData = null; box.hidden = false;
        box.innerHTML = '<div class="banner">הקובץ הזה אינו קובץ גיבוי של יומן הגבייה. בחרי קובץ שנשמר בכפתור „הורדת גיבוי מלא”.</div>';
        return;
      }
      restoreData = d;
      box.hidden = false;
      box.innerHTML = '<div class="confirm" style="background:var(--accent-soft);color:var(--accent)">בקובץ יש ' + d.patients.length + " מטופלות ו-" + d.sessions.length + " פגישות, מגיבוי מ-" + (d.exportedAt ? fmtDate(d.exportedAt.slice(0, 10)) : "תאריך לא ידוע") + ". רשומות עם אותו מזהה יוחלפו בגרסה מהגיבוי; רשומות שאינן בגיבוי יישארו כמו שהן." +
        ' <button type="button" class="btn small primary" id="restore-go">שחזור הנתונים</button></div><p class="note" id="restore-prog"></p>';
    };
    fr.readAsText(file);
  }
  async function doRestore() {
    const d = restoreData; if (!d) return;
    const go = $("#restore-go"); if (go) go.disabled = true;
    const prog = $("#restore-prog");
    const all = d.patients.map((p) => ["patients", p]).concat(d.sessions.map((s) => ["sessions", s]));
    try {
      if (d.settings && typeof d.settings === "object") await saveSettings(d.settings);
      for (let i = 0; i < all.length; i++) {
        const [col, rec] = all[i]; const body = Object.assign({}, rec); delete body.id;
        await setDoc(col, rec.id, body);
        if (prog && (i % 10 === 0 || i === all.length - 1)) prog.textContent = "שוחזרו " + (i + 1) + " מתוך " + all.length + "…";
      }
      restoreData = null;
      toast("השחזור הושלם: " + d.patients.length + " מטופלות ו-" + d.sessions.length + " פגישות");
      render();
    } catch (e) { if (go) go.disabled = false; if (prog) prog.textContent = "השחזור נעצר באמצע. אפשר ללחוץ שוב כדי להשלים אותו."; }
  }


  // ---------- day window (from the month view) ----------
  function openDay(iso, refresh) {
    const prevScroll = refresh && $("#day-scroll") ? $("#day-scroll").scrollTop : null;
    const byDay = groupByDay(Array.from(S.sessions.values()).filter((x) => x.date === iso));
    const evs = byDay.get(iso) || [];
    const charged = evs.filter((x) => x.status !== "free");
    const total = charged.reduce((a, x) => a + charge(x), 0), paid = charged.reduce((a, x) => a + Math.min(charge(x), paidOf(x)), 0);
    const cancelled = evs.filter((x) => x.status !== "held").length;
    const future = iso > todayISO();
    const html = '<div class="dlg-h dd-h"><div class="dd-title"><h2>יום ' + WD_NAME[dow(iso)] + ", " + fmtDate(iso) + (iso === todayISO() ? ' <span class="today-tag">היום</span>' : "") + "</h2>" +
      '<span class="dd-heb">' + hebFull(iso) + "</span>" + holChips(iso) + "</div>" +
      '<div class="dd-nav"><button type="button" class="btn icon-btn" data-dd="-1" aria-label="היום הקודם" title="היום הקודם">' + icon("i-prev") + '</button><button type="button" class="btn icon-btn" data-dd="1" aria-label="היום הבא" title="היום הבא">' + icon("i-next") + '</button><button type="button" class="x" data-close aria-label="סגירה">×</button></div></div>' +
      (isRest(iso) ? '<div class="warnbox"><span>' + restName(iso) + ". בדרך כלל אין פגישות ביום הזה.</span></div>" : "") +
      '<div class="mini dd-mini"><div><span class="lbl">פגישות ביום</span><b>' + charged.length + "</b>" + (cancelled ? '<span class="sub">' + plural(cancelled, "ביטול אחד", "ביטולים") + "</span>" : "") + "</div>" +
      '<div class="' + (total - paid > 0 && !future ? "bad" : "") + '"><span class="lbl">' + (future ? "צפוי לגבייה" : "נותר לגבות") + "</span><b>" + money(total - paid) + "</b></div>" +
      '<div class="good"><span class="lbl">שולם</span><b>' + money(paid) + "</b></div></div>" +
      '<div class="dd-body"><div class="dd-grid" id="day-scroll">' + gridHTML([iso], byDay, false) + "</div>" +
      '<div class="dd-list"><div class="toolbar write-only"><button type="button" class="btn primary small" data-dd-new>' + icon("i-plus") + "פגישה ביום הזה</button></div>" +
      (evs.length ? '<div class="tbl sess" id="dd-rows">' + evs.map((x) => sessionRow(x)).join("") + "</div>" : '<div class="empty">אין פגישות ביום הזה.<span class="write-only">לחיצה על שעה בלוח פותחת פגישה חדשה.</span></div>') +
      "</div></div>";
    openDlg(html, () => {
      S.dayDlg = iso;
      dlg.classList.add("wide");
      const sc = $("#day-scroll"), col = sc && sc.querySelector(".wk-col");
      if (!sc || !col) return;
      if (prevScroll != null) { sc.scrollTop = prevScroll; return; }
      const first = evs.map(timeOf).filter((t) => t != null).sort((a, b) => a - b)[0];
      if (first != null) {
        const hh = col.offsetHeight / Number(col.dataset.hours);
        sc.scrollTop = Math.max(0, ((first - Number(col.dataset.start) * 60) / 60) * hh - 24);
      }
    });
  }
  body.addEventListener("click", (e) => {
    const t = e.target;
    const bd = t.closest("[data-back-day]"); if (bd) { openDay(bd.dataset.backDay); return; }
    if (!S.dayDlg) return;
    const day = S.dayDlg, back = { returnDay: day };
    const dd = t.closest("[data-dd]"); if (dd) { openDay(addDays(day, Number(dd.dataset.dd))); return; }
    if (t.closest("[data-dd-new]")) { openSession(null, S.patientFilter, day, "", back); return; }
    const sl = t.closest("[data-slot]"); if (sl) { if (!S.canWrite) return; const [d, tm] = sl.dataset.slot.split("|"); openSession(null, S.patientFilter, d, tm, back); return; }
    const q = t.closest("[data-qp]"); if (q) { quickPay(q.dataset.qp, q.dataset.m); return; }
    const ev = t.closest("[data-ev]"); if (ev) { openSession(ev.dataset.ev, null, null, null, back); return; }
    const ed = t.closest("[data-edit]"); if (ed) { openSession(ed.dataset.edit, null, null, null, back); return; }
  });
  body.addEventListener("keydown", (e) => {
    if (!S.dayDlg) return;
    const ev = e.target.closest && e.target.closest("[data-ev]");
    if (ev && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openSession(ev.dataset.ev, null, null, null, { returnDay: S.dayDlg }); }
  });

  // ---------- export ----------
  function csv(rows) { return "﻿" + rows.map((r) => r.map((c) => { const s = String(c == null ? "" : c); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); }
  function inRange(iso, range) { if (!iso) return false; if (range === "all") return true; if (range === "year") return iso.slice(0, 4) === S.month.slice(0, 4); return ymOf(iso) === S.month; }
  async function doExport(kind) {
    const range = $("#exp-range").value;
    const tag = range === "all" ? "all" : range === "year" ? S.month.slice(0, 4) : S.month;
    let rows, name;
    if (kind === "payments") {
      rows = [["תאריך תשלום", "מטופלת", "סכום", "אמצעי תשלום", "מספר קבלה", "תאריך הפגישה", "הערה"]];
      const list = [];
      S.sessions.forEach((s) => (s.payments || []).forEach((p) => { if (inRange(p.date, range)) list.push([p.date, patientName(s.patientId), p.amount, mLabel(p.method), p.receipt || "", s.date, s.note || ""]); }));
      list.sort((a, b) => (a[0] < b[0] ? -1 : 1)).forEach((r) => { r[0] = fmtDate(r[0]); r[5] = fmtDate(r[5]); rows.push(r); });
      name = "payments-" + tag + ".csv";
    } else {
      rows = [["תאריך", "שעה", "מטופלת", "סטטוס", "חיוב", "שולם", "יתרה", "אמצעי תשלום", "מספרי קבלה", "הערה"]];
      Array.from(S.sessions.values()).sort(byDateTime).filter((s) => inRange(s.date, range)).forEach((s) => {
        rows.push([fmtDate(s.date), s.time || "", patientName(s.patientId), STATUS[s.status], charge(s), paidOf(s), balOf(s), Array.from(new Set((s.payments || []).map((p) => mLabel(p.method)))).join(" + "), (s.payments || []).map((p) => p.receipt).filter(Boolean).join(" "), s.note || ""]);
      });
      name = "sessions-" + tag + ".csv";
    }
    if (rows.length === 1) { toast("אין נתונים בטווח שבחרת."); return; }
    try { await S.downloads.save({ filename: name, data: csv(rows) }); toast("הקובץ נשמר"); }
    catch (e) { if (e && e.code === "declined") return; toast("ההורדה לא הצליחה. נסי שוב בעוד רגע."); }
  }

  // ---------- events ----------
  $("#m-prev").addEventListener("click", () => { S.month = addMonths(S.month, -1); render(); });
  $("#m-next").addEventListener("click", () => { S.month = addMonths(S.month, 1); render(); });
  $("#add-session").addEventListener("click", () => { if (S.ready) openSession(null); });
  $$(".tabs button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { localStorage.setItem("gvia-tab", S.tab); } catch (e) { /* ignore */ } render(); }));

  $("#view").addEventListener("click", async (e) => {
    if (suppressClick) { suppressClick = false; return; }
    const t = e.target;
    const evx = t.closest("[data-ev]"); if (evx) { if (popFor === evx.dataset.ev) closePop(); else openPop(evx.dataset.ev, evx); return; }
    const rmd = t.closest("[data-remind]"); if (rmd) { openReminder(rmd.dataset.remind); return; }
    if (t.closest("#go-backup")) { S.tab = "settings"; render(); const b = $("#backup-dl"); if (b) b.scrollIntoView({ block: "center" }); return; }
    if (t.closest("#backup-dl")) { doBackup(); return; }
    if (t.closest("#restore-go")) { doRestore(); return; }
    if (t.closest("#save-remind")) { try { await saveSettings({ remindText: $("#set-remind").value.trim() }); toast("נוסח התזכורת נשמר"); } catch (err) { /* reported */ } return; }
    if (t.closest("#reset-remind")) { $("#set-remind").value = DEFAULT_REMIND; return; }
    const qp = t.closest("[data-qp]"); if (qp) { quickPay(qp.dataset.qp, qp.dataset.m); return; }
    const pp = t.closest("[data-pay-patient]"); if (pp) { openPayPatient(pp.dataset.payPatient); return; }
    const op = t.closest("[data-open-patient]"); if (op) { openPatient(op.dataset.openPatient); return; }
    const ed = t.closest("[data-edit]"); if (ed) { openSession(ed.dataset.edit); return; }
    const nd = t.closest("[data-new-day]"); if (nd) { openSession(null, S.patientFilter, nd.dataset.newDay); return; }
    const sl = t.closest("[data-slot]"); if (sl) { if (!S.canWrite) return; const [d, tm] = sl.dataset.slot.split("|"); S.selDay = d; openSession(null, S.patientFilter, d, tm); return; }
    const wk = t.closest("[data-wk]");
    if (wk) {
      const k = Number(wk.dataset.wk);
      if (k === 0) { S.weekStart = sundayOf(todayISO()); S.selDay = todayISO(); }
      else { S.weekStart = addDays(S.weekStart, 7 * k); S.selDay = addDays(S.selDay || S.weekStart, 7 * k); }
      S.month = ymOf(addDays(S.weekStart, 3));
      render(); return;
    }
    const dy = t.closest("[data-day]");
    if (dy) { S.selDay = dy.dataset.day; if (S.tab === "sessions" && S.sview === "month") { $$(".cal .day.sel").forEach((x) => x.classList.remove("sel")); dy.classList.add("sel"); openDay(dy.dataset.day); } else render(); return; }
    const f = t.closest("[data-filter]"); if (f) { S.filter = f.dataset.filter; render(); return; }
    const pf = t.closest("[data-pfilter]"); if (pf) { S.pFilter = pf.dataset.pfilter; render(); return; }
    const sv = t.closest("[data-sview]"); if (sv) { S.sview = sv.dataset.sview; try { localStorage.setItem("gvia-sview", S.sview); } catch (err) { /* ignore */ } render(); return; }
    if (t.closest("#clear-pf")) { S.patientFilter = ""; render(); return; }
    if (t.closest("[data-new-session]")) { openSession(null); return; }
    if (t.closest("#add-patient")) { openPatientEdit(null); return; }
    if (t.closest("#exp-payments")) { doExport("payments"); return; }
    if (t.closest("#exp-sessions")) { doExport("sessions"); return; }
    if (t.closest("#save-settings")) {
      const price = Number($("#set-price").value);
      if (!(price >= 0)) { toast("המחיר צריך להיות מספר."); return; }
      try { await saveSettings({ clinicName: $("#set-name").value.trim(), defaultPrice: price, dayStart: Number($("#set-start").value), dayEnd: Math.max(Number($("#set-end").value), Number($("#set-start").value) + 1), sessionLength: Number($("#set-len").value) || 50 }); toast("ההגדרות נשמרו"); } catch (err) { /* reported */ }
      return;
    }
    const ce = t.closest("#clear-examples");
    if (ce) { ce.outerHTML = '<div class="confirm">למחוק את כל נתוני הדוגמה? הנתונים שלך לא יימחקו. <button type="button" class="btn small danger" id="clear-examples2">כן, למחוק</button></div>'; return; }
    if (t.closest("#clear-examples2")) {
      try {
        const ss = Array.from(S.sessions.values()).filter(isExampleSession).map((x) => [x.id, plain(x)]);
        const ps = Array.from(S.patients.values()).filter((x) => x.example).map((x) => { const c = Object.assign({}, x); delete c.id; return [x.id, c]; });
        for (const [id] of ss) await delDoc("sessions", id);
        for (const [id] of ps) await delDoc("patients", id);
        toast("נתוני הדוגמה נמחקו", async () => { for (const [id, c] of ps) await setDoc("patients", id, c); for (const [id, c] of ss) await setDoc("sessions", id, c); });
      } catch (err) { /* reported */ }
    }
  });
  $("#view").addEventListener("change", (e) => {
    if (e.target.id === "restore-file" && e.target.files && e.target.files[0]) { readRestore(e.target.files[0]); e.target.value = ""; return; }
    if (e.target.id === "s-patient") { S.patientFilter = e.target.value; render(); }
  });
  $("#view").addEventListener("input", (e) => {
    if (e.target.id !== "p-search") return;
    S.pSearch = e.target.value;
    const all = Array.from(S.patients.values()).sort((a, b) => (a.active === b.active ? a.name.localeCompare(b.name, "he") : a.active ? -1 : 1));
    const box = $("#pts-body"); if (box) box.innerHTML = patientsTable(all, new Map(all.map((p) => [p.id, patientSummary(p.id)])));
  });
  $("#view").addEventListener("keydown", (e) => {
    const evk = e.target.closest && e.target.closest("[data-ev]");
    if (evk && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openPop(evk.dataset.ev, evk); return; }
    const d = e.target.closest && e.target.closest("[data-day]");
    if (d && (e.key === "Enter" || e.key === " ") && S.tab === "sessions" && S.sview === "month") { e.preventDefault(); S.selDay = d.dataset.day; openDay(d.dataset.day); return; }
    if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.selDay = d.dataset.day; render(); const el = $('[data-day="' + S.selDay + '"]'); if (el) el.focus(); }
  });
  try { window.matchMedia("(max-width: 700px)").addEventListener("change", () => { if (S.tab === "sessions") render(); }); } catch (e) { /* old browser */ }
  // actions inside the patient dialog's session list
  body.addEventListener("click", (e) => {
    if (!e.target.closest("#pp-rows")) return;
    const qp = e.target.closest("[data-qp]");
    if (qp) { quickPay(qp.dataset.qp, qp.dataset.m); closeDlg(); return; }
    const ed = e.target.closest("[data-edit]"); if (ed) openSession(ed.dataset.edit);
  });

  function applyWriteMode() {
    $("#app").classList.toggle("readonly", !S.canWrite);
    body.classList.toggle("readonly", !S.canWrite);
    const b = $("#banner");
    b.hidden = S.canWrite;
    b.textContent = "מצב צפייה בלבד: אפשר לראות את הנתונים, אבל לא לשנות אותם.";
  }

  // ---------- boot ----------
  render();
  (async () => {
    const api = window.claude && window.claude.use ? window.claude : null;
    if (!api) { S.noDb = true; render(); return; }
    const [db, user, downloads] = await Promise.all([api.use("db"), api.use("user"), api.use("downloads")]);
    S.downloads = downloads;
    if (!db) { S.noDb = true; render(); return; }
    S.db = db;
    if (user) { const can = await user.can("data.write"); if (can === false) { S.canWrite = false; applyWriteMode(); } }
    const got = { p: false, s: false, c: false };
    const mark = (k) => { got[k] = true; if (got.p && got.s && got.c) S.ready = true; render(); };
    const onErr = () => { toast("החיבור לנתונים נקטע. רענני את הדף."); };
    db.doc("settings/main").onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : {};
      S.settings = { clinicName: d.clinicName || "", defaultPrice: d.defaultPrice != null ? d.defaultPrice : 400, dayStart: d.dayStart != null ? d.dayStart : 8, dayEnd: d.dayEnd != null ? d.dayEnd : 21, sessionLength: d.sessionLength || 50, remindText: d.remindText || "", lastBackup: d.lastBackup || "" };
      mark("c");
    }, onErr);
    db.collection("patients").onSnapshot((snap) => {
      S.patients = new Map(snap.docs.map((d) => [d.id, Object.assign({ id: d.id, phone: "", note: "", active: true }, d.data())]));
      mark("p");
    }, onErr);
    db.collection("sessions").onSnapshot((snap) => {
      S.sessions = new Map(snap.docs.map((d) => [d.id, Object.assign({ id: d.id, payments: [], status: "held", note: "" }, d.data())]));
      mark("s");
      if (dlg.open && S.dayDlg) openDay(S.dayDlg, true);
    }, onErr);
  })();
})();
</script>
