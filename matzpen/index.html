   Collection docs: "vault" = {salt, iter, check:{iv,ct}}; "p-…" = one project each.

function makeProject(id,name,type,hosting,database){

}
const str=(v,max=2000)=>typeof v==='string'?v.slice(0,max):'';
function isBox(b){return !!b&&typeof b==='object'&&typeof b.iv==='string'&&typeof b.ct==='string';}
function normalizeProject(id,d){
  if(!d||typeof d!=='object'||typeof d.name!=='string')return null;
  const type=['website','donations','internal'].includes(d.type)?d.type:'internal';
  const services={};for(const role of Object.keys(roles)){const v=d.services?.[role];services[role]=providerChoices[role].includes(v)?v:providerChoices[role][0];}
  const done=Array.isArray(d.done)?d.done.filter(x=>typeof x==='string'):[];
  const doneAt=d.doneAt&&typeof d.doneAt==='object'?Object.fromEntries(Object.entries(d.doneAt).filter(([,v])=>typeof v==='string')):{};
  const accounts={};if(d.accounts&&typeof d.accounts==='object')for(const role of Object.keys(roles))if(typeof d.accounts[role]==='string')accounts[role]=str(d.accounts[role],200);
  const extras=Array.isArray(d.extras)?d.extras.filter(x=>x&&typeof x.id==='string'&&Object.hasOwn(roles,x.role)).map(x=>({id:x.id,role:x.role,name:str(x.name,120)||'פריט ללא שם',kind:str(x.kind,40)||'אחר',username:str(x.username,200),url:str(x.url,500),purpose:str(x.purpose,300),where:str(x.where,300),secret:isBox(x.secret)?{iv:x.secret.iv,ct:x.secret.ct}:null,updatedAt:typeof x.updatedAt==='number'?x.updatedAt:0})):[];
  return {id,name:str(d.name,100),type,description:str(d.description,300),services,done,doneAt,extras,accounts,createdAt:typeof d.createdAt==='number'?d.createdAt:0};
}

function dbErrorText(e){const c=e?.code;return c==='quota_exceeded'?'נגמר מקום האחסון. מחקי פריטים שאינם בשימוש ונסי שוב.':c==='resource_exhausted'?'יותר מדי שינויים ברגע אחד. המתיני רגע ונסי שוב.':c==='revoked'||c==='not_granted'?'הגישה לשמירה הופסקה. רענני את הדף.':'השמירה נכשלה. בדקי את החיבור לאינטרנט ונסי שוב.';}
function queueWrite(id,fn){const prev=writeChains.get(id)||Promise.resolve();const next=prev.then(fn).catch(e=>{toast(dbErrorText(e));});writeChains.set(id,next);return next;}
function projectData(p){const {id,...data}=p;return JSON.parse(JSON.stringify(data));}
function save(p){if(!p)return;if(!coll)return;const data=projectData(p);queueWrite(p.id,()=>coll.doc(p.id).set(data));}

function saveVaultMeta(){if(!coll)return Promise.resolve();return queueWrite('vault',()=>coll.doc('vault').set(vaultMeta));}
function applySnapshot(snap){
  const list=[];let vault=null;
  for(const doc of snap.docs){const data=doc.data();if(!data)continue;if(doc.id==='vault'){if(typeof data.salt==='string'&&typeof data.iter==='number'&&isBox(data.check))vault={salt:data.salt,iter:data.iter,check:data.check,createdAt:data.createdAt||0};}else if(doc.id.startsWith('p-')){const p=normalizeProject(doc.id,data);if(p)list.push(p);}}
  list.sort((a,b)=>a.createdAt-b.createdAt);
  projects=list;
  if(vault&&vaultMeta&&vault.salt!==vaultMeta.salt)lockVault(false);
  vaultMeta=vault;syncState='ready';
  if(modalType||isTyping())pendingRender=true;else render();

function isTyping(){const a=document.activeElement;return !!a&&a.matches?.('input,textarea,select')&&!!a.closest('#app,#drawer-root');}
async function init(){
  render();

    const [d,u]=api?.use?await Promise.all([api.use('db'),api.use('user')]):[null,null];
    const id=u?await u.id():null;
    if(!d||!id){clearTimeout(timer);syncState='offline';render();return;}
    db=d;coll=db.collection('data/users/'+id);
    coll.onSnapshot(snap=>{clearTimeout(timer);applySnapshot(snap);},()=>{clearTimeout(timer);syncState='error';render();});

}

/* ---------- Vault crypto ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const VAULT_CHECK='matzpen-vault-ok';
function b64(buf){let s='';for(const b of new Uint8Array(buf))s+=String.fromCharCode(b);return btoa(s);}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function deriveKey(password,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptText(key,text){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text));return {iv:b64(iv),ct:b64(ct)};}
async function decryptText(key,box){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return td.decode(pt);}

function sidebar(r){const open=projects.reduce((n,p)=>n+openTasks(p).length,0);return `<aside class="sidebar" aria-label="ניווט ראשי">
  <a class="brand" href="#projects" aria-label="מצפן — הפרויקטים שלי"><span class="brand-mark">${icon('compass',27)}</span><span><span class="brand-name">מצפן</span><span class="brand-sub" style="display:block">הפרויקטים שלך, בתמונה אחת</span></span></a>
  <nav><a class="nav-item ${r.page!=='tasks'?'active':''}" href="#projects">${icon('grid',18)}הפרויקטים שלי<span class="nav-count">${projects.length}</span></a><a class="nav-item ${r.page==='tasks'?'active':''}" href="#tasks">${icon('checklist',18)}משימות לטיפול<span class="nav-count">${open}</span></a></nav>
  <div class="sidebar-label">הפרויקטים שלי<button data-action="new-project" aria-label="פרויקט חדש">${icon('plus',14)}</button></div>
  <div class="sidebar-projects">${projects.map((p,i)=>`<a class="sidebar-project ${r.project?.id===p.id?'selected':''}" href="#project/${esc(p.id)}/map"><span class="project-dot ${i%2?'blue':''}"></span>${esc(p.name)}</a>`).join('')}</div>
  <div class="sidebar-bottom"><button class="nav-item" data-action="vault-toggle">${icon('lock',17)}${vaultKey?'נעילת הכספת':'פתיחת הכספת'}</button><button class="nav-item" data-action="export">${icon('download',17)}ייצוא גיבוי</button><button class="nav-item" data-action="import">${icon('upload',17)}ייבוא מגיבוי</button><button class="nav-item" data-action="help">${icon('help',17)}איך זה עובד?</button><div class="profile"><div class="avatar">מ</div><div>אזור העבודה שלי<div class="muted">${syncState==='ready'?'מסונכרן':syncState==='loading'?'טוען…':'לא נשמר'}</div></div></div></div>
</aside>`;}
function render(){pendingRender=false;const r=route();document.title=`מצפן · ${r.project?.name|| (r.page==='tasks'?'משימות לטיפול':'הפרויקטים שלי')}`;
  $('#app').innerHTML=`${sidebar(r)}<div class="app-shell"><div class="demo-strip sync-${syncState}">${icon(syncState==='ready'?'check':syncState==='loading'?'clock':'alert',13)}<span>${syncText()}</span>${vaultMeta?`<button data-action="vault-toggle">${vaultKey?'נעילת הכספת':'פתיחת הכספת'}</button>`:''}</div><header class="topbar"><a class="mobile-brand" href="#projects">${icon('compass',23)}מצפן</a><div class="breadcrumb"><a href="#projects">אזור העבודה שלי</a>${icon('chevron',12)}<strong>${esc(r.project?.name||(r.page==='tasks'?'משימות לטיפול':'הפרויקטים שלי'))}</strong></div><div class="top-tools"><span class="workspace-dot ${vaultKey?'open':''}"></span><span>${!vaultMeta?'מרחב אישי':vaultKey?'הכספת פתוחה':'הכספת נעולה'}</span><button class="icon-button" data-action="help" aria-label="עזרה, גיבוי וייבוא">${icon('help',17)}</button></div></header><main id="main" class="main" tabindex="-1">${syncState==='loading'?loadingView():r.page==='project'?projectPage(r.project,r.tab):r.page==='tasks'?allTasksPage():dashboard()}</main></div>`;
  if(drawer)renderDrawer();
}
function loadingView(){return `<div class="empty-state" style="margin-top:60px">${icon('compass',28)}<h3>טוען את הפרויקטים שלך…</h3><p>הנתונים נטענים מהחשבון שלך.</p></div>`;}
function dashboard(){const count=projects.reduce((n,p)=>n+services(p).length,0),open=projects.reduce((n,p)=>n+openTasks(p).length,0),restore=projects.filter(p=>!p.done.includes('restore')).length;
  const heading=`<div class="page-heading"><div><div class="eyebrow">מקום מסודר לכל מה שמחזיק את הפרויקט</div><h1>הפרויקטים שלי<span style="color:#9ba993;font-size:22px;font-weight:400;margin-right:9px">.</span></h1><p>כל המערכות, פרטי הגישה והצעדים הבאים — בתמונה אחת.</p></div><button class="btn btn-primary" data-action="new-project">${icon('plus',17)}פרויקט חדש</button></div>`;
  if(!projects.length)return `${heading}<section class="attention-panel first-run"><div class="empty-state">${icon('map',30)}<h3>עוד אין כאן פרויקטים</h3><p>בוחרים שם, סוג ושירותים, ומצפן בונה מפה של המערכות ותהליך של שבעה שלבים: בעלות, אבטחה, פרטי גישה, גיבוי ובדיקת שחזור.</p><button class="btn btn-primary" style="margin-top:18px" data-action="new-project">${icon('plus',16)}יצירת הפרויקט הראשון</button></div></section><div class="dashboard-note">${icon('lock',13)}סיסמאות ומפתחות נשמרים מוצפנים בסיסמת־האב שלך. רק את רואה את הנתונים במרחב הזה.</div>`;
  return `${heading}
  <div class="stats">${stat('פרויקטים במרחב',projects.length,'grid')}${stat('מערכות במפה',count,'map')}${stat('משימות להשלמה',open,'checklist',true)}${stat('פרויקטים ללא בדיקת שחזור',restore,'restore',true)}</div>
  <div class="section-header"><h2>מבט על הפרויקטים</h2><span class="muted">${projects.length} פרויקטים · תהליך עבודה משותף</span></div><div class="project-grid">${projects.map(projectCard).join('')}</div>
  <section class="attention-panel" aria-label="הצעדים הבאים"><div class="panel-heading"><h2>כדאי לטפל עכשיו</h2><a class="muted" href="#tasks">לכל המשימות ${icon('chevron',12)}</a></div>${projects.flatMap(p=>openTasks(p).filter(t=>['recovery','restore'].includes(t.id)).map(t=>({p,t}))).slice(0,3).map(({p,t})=>`<div class="task-row"><div class="task-sign">${icon(t.id==='restore'?'restore':'key',16)}</div><div class="task-info"><strong>${esc(t.title)}</strong><p>${esc(p.name)} · ${esc(roles[t.service])}</p></div><span class="badge amber">ממתין לביצוע</span><button class="task-go" data-action="open-task" data-project="${esc(p.id)}" data-task="${t.id}">למשימה ${icon('chevron',14)}</button></div>`).join('')||'<div class="empty-state">משימות שחזור הגישה ובדיקת השחזור סומנו כבוצעו בכל הפרויקטים.</div>'}</section>
  <div class="dashboard-note">${icon('lock',13)}סיסמאות ומפתחות נשמרים מוצפנים בסיסמת־האב שלך. רק את רואה את הנתונים במרחב הזה.</div>`;}
function stat(label,number,name,warm=false){return `<div class="stat ${warm?'warm':''}"><div><div class="stat-label">${label}</div><div class="stat-number">${number}</div></div><span class="stat-icon">${icon(name,18)}</span></div>`;}
function projectCard(p){const pending=openTasks(p).length;return `<article class="project-card"><div class="project-card-top"><div class="project-symbol ${p.type==='website'?'blue':''}">${projectIcon(p,24)}</div><span class="badge ${pending?'amber':''}">${pending?`${pending} משימות להשלמה`:'המשימות סומנו כבוצעו'}</span></div><h2><a href="#project/${esc(p.id)}/map">${esc(p.name)}</a></h2><p class="project-description">${esc(p.description)}</p><div class="provider-row">${services(p).filter(([role])=>['code','hosting','database','automation'].includes(role)).map(([,key])=>`<span class="provider-chip"><span class="provider-mini">${key==='vercel'?'▲':key==='github'?icon('github',11):key==='supabase'?'ϟ':'●'}</span><bdi>${esc(providers[key].name)}</bdi></span>`).join('')}</div><div class="progress-label"><span>התקדמות בתהליך</span><strong>${completed(p)} מתוך ${taskList(p).length} משימות</strong></div><div class="progress-track" role="progressbar" aria-label="התקדמות בתהליך של ${esc(p.name)}" aria-valuenow="${percent(p)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${percent(p)}%"></div></div><div class="project-footer"><span>${services(p).length} מערכות במפה · ${p.extras.length} פרטי גישה</span><a href="#project/${esc(p.id)}/map">פתיחת הפרויקט ${icon('arrow',16)}</a></div></article>`;}
function projectPage(p,tab){const names={map:['מפת הפרויקט','map'],tasks:['תהליך העבודה','checklist'],vault:['פרטי גישה','key'],backups:['גיבוי ושחזור','restore']};return `<div class="page-heading project-heading"><div class="project-title-group"><div class="project-symbol ${p.type==='website'?'blue':''}">${projectIcon(p,24)}</div><div><h1>${esc(p.name)}</h1><p>${esc(p.description)}</p></div></div><div class="project-actions"><button class="btn btn-secondary" data-action="edit-project" data-project="${esc(p.id)}">${icon('edit',14)}עריכת הפרויקט</button><button class="btn btn-primary" data-action="new-project">${icon('plus',14)}פרויקט חדש</button></div></div><nav class="tabs" aria-label="תצוגות הפרויקט">${Object.entries(names).map(([key,[label,i]])=>`<a class="tab ${key===tab?'active':''}" ${key===tab?'aria-current="page"':''} href="#project/${esc(p.id)}/${key}">${icon(i,17)}${label}${key==='tasks'?`<span class="tab-count">${openTasks(p).length}</span>`:key==='vault'?`<span class="tab-count">${p.extras.length}</span>`:''}</a>`).join('')}</nav>${tab==='map'?mapView(p):tab==='tasks'?tasksView(p):tab==='vault'?vaultView(p):backupsView(p)}`;}
function mapView(p){const labels={code:'מפרסם קוד',hosting:'מריץ את האתר',database:'שומר מידע',domain:'מפנה לאתר',automation:p.services.automation==='make'?'מחבר תהליכים':'שולח דואר',backup:'שומר עותק לשחזור'};return `<section class="map-container" aria-label="מפת מערכות הפרויקט"><div class="map-toolbar"><div><h2>כל החיבורים של הפרויקט</h2><p>לחצי על מערכת כדי לראות מה תפקידה, מה צריך לעשות ואילו פרטי גישה שמורים לה.</p></div><div class="map-legend"><span><i class="legend-dot"></i>הושלם</span><span><i class="legend-dot amber"></i>דורש השלמה</span></div></div><div class="map-canvas"><svg class="map-lines" viewBox="0 0 1000 578" preserveAspectRatio="none" aria-hidden="true"><path d="M500 245V150Q500 104 450 104H240M500 245V150Q500 104 550 104H760M425 289H190${p.services.database!=='none'?'M575 289H810':' '}M500 335V430Q500 474 450 474H240M500 335V430Q500 474 550 474H760"/><circle cx="500" cy="150" r="3.5"/><circle cx="500" cy="430" r="3.5"/></svg><div class="node-center"><div class="center-icon">${projectIcon(p,21)}</div><strong>${esc(p.name)}</strong><p>${services(p).length} מערכות · תמונה אחת</p></div>${services(p).map(([role,key])=>{const pending=taskList(p).filter(t=>t.service===role&&!p.done.includes(t.id)).length,n=secretItems(p,role).length;return `<button class="map-node node-${role}" data-action="service" data-project="${esc(p.id)}" data-service="${role}" aria-label="פתיחת ${esc(providers[key].name)} — ${esc(providers[key].role)}"><span class="node-head">${logo(key)}<span><strong>${esc(providers[key].name)}</strong><span>${esc(providers[key].role)}</span></span></span><span class="node-bottom"><span>${n===0?'אין פרטי גישה':n===1?'פריט גישה אחד':`${n} פרטי גישה`}</span><span class="badge ${pending?'amber':''}">${pending?`${pending} להשלמה`:'הושלם'}</span></span></button><span class="map-edge-label edge-${role}">${labels[role]}</span>`;}).join('')}</div><div class="map-bottom">${icon('info',13)}המפה מתעדת את השירותים של הפרויקט. מצפן אינו מתחבר לחשבונות עצמם.</div></section>${openTasks(p).length?`<div class="next-step">${icon('checklist',21)}<div><strong>הצעד הבא: ${esc(openTasks(p)[0].title)}</strong><p>משימה אחת בכל פעם. אפשר לראות הסבר ולסמן השלמה בתהליך העבודה.</p></div><button data-action="open-task" data-project="${esc(p.id)}" data-task="${openTasks(p)[0].id}">פתיחת המשימה ${icon('arrow',15)}</button></div>`:`<div class="next-step">${icon('check',21)}<div><strong>כל המשימות סומנו כבוצעו</strong><p>הסימון מתעד ביצוע ידני. כדאי לחזור על הבדיקות מדי תקופה.</p></div></div>`}`;}
function taskItem(p,t,details=false){const done=p.done.includes(t.id);return `<div class="check-item" id="task-${t.id}"><button class="check-box ${done?'checked':''}" role="checkbox" aria-checked="${done}" aria-label="${done?'ביטול השלמת':'סימון השלמת'} ${esc(t.title)}" data-action="toggle-task" data-project="${esc(p.id)}" data-task="${t.id}">${done?icon('check',13):''}</button><div class="check-item-text"><strong>${esc(t.title)}</strong><p>${esc(t.desc)}</p>${details?`<p style="margin-top:8px;color:#6e835f">${esc(t.how)}</p>`:''}${t.id==='mfa'&&p.services.hosting==='contabo'?'<p>בשרת בניהול עצמי יש להגדיר גם גישה מאובטחת לשרת, מעבר לאבטחת חשבון הספק.</p>':''}</div><span class="badge ${done?'neutral':'amber'}">${done?`בוצע${p.doneAt[t.id]?` · ${fmtDate(p.doneAt[t.id])}`:''}`:'ממתין לביצוע'}</span></div>`;}
function tasksView(p){return `<div class="content-card"><div class="section-header"><h2>אותו תהליך, מותאם לשירותים שבחרת</h2><span class="badge neutral">${completed(p)} מתוך ${taskList(p).length}</span></div><p class="intro-line">סמני כל משימה אחרי שביצעת אותה. מצפן שומר את תאריך הסימון.</p>${stepNames.map((name,i)=>`<section class="checklist-group"><h3 class="checklist-group-title"><span class="step-num">${i+1}</span>${name}</h3>${taskList(p).filter(t=>t.step===i+1).map(t=>taskItem(p,t,true)).join('')}</section>`).join('')}</div>`;}
function templatesFor(p,role){const key=p.services[role];if(key==='none')return [];const templates={
  code:[{name:'מפתח גישה למאגר',purpose:'פרסום גרסאות וחיבור לשירות האירוח',where:'החיבור בין מאגר הקוד לשירות האירוח',kind:'מפתח API'},{name:'סיסמת חשבון GitHub',purpose:'כניסה לחשבון שבו נמצא הקוד',where:'חשבון הבעלים של המאגר',kind:'סיסמה'}],
  hosting:[{name:key==='contabo'?'מפתח גישה לשרת':'מפתח ניהול פרסומים',purpose:key==='contabo'?'כניסת מנהל לשרת הפרויקט':'פרסום גרסאות ועדכון הגדרות הפרויקט',where:key==='contabo'?'בכלי ההתחברות של מנהל השרת':'בחיבור הפרסום של הפרויקט',kind:key==='contabo'?'מפתח שרת':'מפתח API'},{name:'קוד שחזור לחשבון',purpose:'שחזור גישה במקרה שאמצעי האימות אינו זמין',where:'בערכת החירום המוגנת',kind:'קוד שחזור'}],
  database:[{name:key==='airtable'?'מפתח גישה לרשומות':'פרטי חיבור לבסיס הנתונים',purpose:'קריאה ועדכון של נתוני הפרויקט',where:'בהגדרות הסודיות של סביבת הייצור',kind:key==='airtable'?'מפתח API':'פרטי חיבור'}],
  domain:[{name:'מפתח לניהול רשומות הכתובת',purpose:'עדכון ההפניה מהדומיין לשירות האירוח',where:'בכלי ניהול הכתובות של הפרויקט',kind:'מפתח API'}],
  automation:[{name:key==='make'?'מפתח לחיבור האוטומציות':'מפתח לשליחת דואר',purpose:key==='make'?'העברת עדכונים בין המערכת לתהליכי העבודה':'שליחת אישורים והודעות מהאתר',where:key==='make'?'בחיבור של תהליך העבודה לפרויקט':'בהגדרות הסודיות של האתר',kind:'מפתח API'}],
  backup:[{name:'פרטי גישה ליעד הגיבוי',purpose:'גישה לעותקים לצורך גיבוי ושחזור',where:'בכספת ובערכת חירום נפרדת ומוגנת',kind:'פרטי גישה'}],
};return (templates[role]||[]).map((x,i)=>({...x,tid:`${role}-${i}`,role}));}
function secretItems(p,role){return p.services[role]==='none'?[]:p.extras.filter(x=>x.role===role);}
function suggestions(p,role){const names=new Set(p.extras.map(x=>x.name));return templatesFor(p,role).filter(t=>!names.has(t.name));}
function vaultNotice(){return `<div class="vault-notice">${icon('lock',17)}<span>${vaultKey?'הכספת פתוחה. הערכים מוצפנים בסיסמת־האב שלך, והכספת תינעל לבד אחרי 10 דקות ללא פעילות.':vaultMeta?'הכספת נעולה. כדי לחשוף, להעתיק או לשמור ערך תתבקשי להזין את סיסמת־האב.':'בשמירת הסיסמה הראשונה תגדירי סיסמת־אב. כל הערכים יוצפנו בה בדפדפן לפני השמירה.'}</span></div>`;}
function secretCard(p,item){const key=`${p.id}:${item.id}`,shown=revealed.has(key),prov=providers[p.services[item.role]],link=item.url?safeUrl(item.url):'';return `<article class="secret-card" data-search="${esc(`${item.name} ${item.purpose} ${item.username} ${item.kind} ${prov.name}`.toLowerCase())}"><div class="secret-head"><strong>${esc(item.name)}</strong><span class="badge neutral">${esc(item.kind)}</span></div>${item.purpose?`<p>${esc(item.purpose)}</p>`:''}<div class="secret-context"><span>${esc(prov.name)}</span><span>${esc(roles[item.role])}</span>${item.updatedAt?`<span>עודכן ${fmtDate(item.updatedAt)}</span>`:''}</div>${item.username?`<div class="secret-field"><span class="secret-field-label">משתמש</span><bdi class="secret-field-value">${esc(item.username)}</bdi><button class="icon-button" data-action="copy-user" data-project="${esc(p.id)}" data-secret="${esc(item.id)}" aria-label="העתקת שם המשתמש של ${esc(item.name)}">${icon('copy',14)}</button></div>`:''}${link?`<div class="secret-field"><span class="secret-field-label">כתובת</span><a class="secret-field-value" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(item.url)}</a></div>`:''}${item.where?`<p class="secret-where">איפה משתמשים: ${esc(item.where)}</p>`:''}${item.secret?`<div class="secret-value-row"><span class="secret-value ${shown?'':'masked'}">${shown?esc(revealed.get(key)):'••••••••••••••••••••'}</span><button class="icon-button" data-action="reveal" data-project="${esc(p.id)}" data-secret="${esc(item.id)}" aria-label="${shown?'הסתרת':'הצגת'} ${esc(item.name)}">${icon(shown?'eyeoff':'eye',16)}</button><button class="icon-button" data-action="copy" data-project="${esc(p.id)}" data-secret="${esc(item.id)}" aria-label="העתקת ${esc(item.name)}">${icon('copy',15)}</button></div>`:`<p class="secret-empty">לא נשמר ערך. אפשר להוסיף אותו בעריכה.</p>`}<div class="secret-actions"><button class="btn btn-ghost btn-small" data-action="edit-secret" data-project="${esc(p.id)}" data-secret="${esc(item.id)}">${icon('edit',13)}עריכה</button><button class="btn btn-ghost btn-small danger" data-action="delete-secret" data-project="${esc(p.id)}" data-secret="${esc(item.id)}">${icon('trash',13)}מחיקה</button></div></article>`;}
function suggestionsBlock(p,list){return list.length?`<section class="suggestions" aria-label="פריטים מומלצים"><h3>מומלץ לתעד</h3><div class="suggestion-list">${list.map(s=>`<button class="suggestion" data-action="add-secret" data-project="${esc(p.id)}" data-role="${s.role}" data-template="${s.tid}">${icon('plus',14)}<span><strong>${esc(s.name)}</strong><span>${esc(providers[p.services[s.role]].name)} · ${esc(s.kind)}</span></span></button>`).join('')}</div></section>`:'';}
function vaultView(p){const items=services(p).flatMap(([role])=>secretItems(p,role));return `<div class="search-row"><label class="search-box">${icon('search',16)}<input type="search" id="vault-search" placeholder="חיפוש לפי שם, מערכת או שימוש" aria-label="חיפוש בפרטי הגישה"></label><button class="btn btn-primary" data-action="add-secret" data-project="${esc(p.id)}">${icon('plus',15)}פריט גישה חדש</button></div>${vaultNotice()}${items.length?`<div id="vault-items">${items.map(x=>secretCard(p,x)).join('')}</div><div id="vault-empty" class="empty-state" hidden>${icon('search',28)}<h3>לא נמצאו פרטי גישה</h3><p>נסי לחפש שם מערכת או מטרה אחרת.</p></div>`:`<div class="empty-state">${icon('key',28)}<h3>עוד אין פרטי גישה בפרויקט</h3><p>הוסיפי סיסמה, מפתח או קוד שחזור. הערך יוצפן לפני שהוא נשמר.</p></div>`}${suggestionsBlock(p,services(p).flatMap(([role])=>suggestions(p,role)))}`;}
function backupsView(p){const done=p.done.includes('backup'),restored=p.done.includes('restore');const backupText=done?`סומנה ב־${fmtDate(p.doneAt.backup)||'—'}`:'טרם סומנה',restoreText=restored?`בוצעה ב־${fmtDate(p.doneAt.restore)||'—'}`:'טרם תועדה';return `<p class="intro-line">תוכנית הגיבוי של הפרויקט: מה מגבים, לאן, ומתי נבדק השחזור לאחרונה.</p><div class="backup-grid">${[
  {icon:'code',title:'קוד וגרסאות',desc:'קוד הפרויקט והיסטוריית השינויים שלו.',target:'מאגר קוד + עותק נפרד',freq:'בכל שינוי קוד'},
  {icon:'database',title:'נתונים',desc:p.services.database==='none'?'לא נבחר בסיס נתונים לפרויקט.':`המידע השמור ב־${providers[p.services.database].name}.`,target:p.services.database==='none'?'לא רלוונטי':'יעד גיבוי נפרד ומוצפן',freq:p.services.database==='none'?'לא רלוונטי':'יומי'},
  {icon:'cloud',title:'קבצים והגדרות',desc:'קבצים שהועלו, הגדרות ותהליכים חיצוניים.',target:'אחסון נפרד ומוצפן',freq:'יומי'},
].map(x=>`<article class="backup-card">${icon(x.icon,24)}<h3>${x.title}</h3><p>${esc(x.desc)}</p><div class="backup-kv"><span>יעד מומלץ</span><strong>${x.target}</strong></div><div class="backup-kv"><span>תדירות מומלצת</span><strong>${x.freq}</strong></div><div class="backup-kv"><span>הגדרת גיבוי</span><strong>${backupText}</strong></div><div class="backup-kv"><span>בדיקת שחזור</span><strong>${restoreText}</strong></div></article>`).join('')}</div><div class="recovery-box"><div class="section-header"><h3>מסלול החזרה לפעולה</h3><span class="badge ${restored?'neutral':'amber'}">${restored?'שחזור נבדק':'בדיקת שחזור נדרשת'}</span></div><div class="recovery-steps"><span class="recovery-step">1. גישה לערכת החירום</span>${icon('chevron',13)}<span class="recovery-step">2. בחירת גיבוי</span>${icon('chevron',13)}<span class="recovery-step">3. שחזור לסביבת בדיקות</span>${icon('chevron',13)}<span class="recovery-step">4. בדיקת נתונים ותפקוד</span></div><p>ערכת החירום צריכה להיות נגישה גם כשהפרויקט או מצפן אינם זמינים. גיבוי הקוד אינו מחליף גיבוי של הנתונים והקבצים. כדאי לשמור גם ייצוא גיבוי של מצפן במקום נפרד.</p><div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap"><button class="btn btn-secondary btn-small" data-action="toggle-task" data-project="${esc(p.id)}" data-task="backup">${icon(done?'check':'plus',14)}${done?'ביטול סימון הגדרת גיבוי':'סימון הגדרת גיבוי'}</button><button class="btn btn-primary btn-small" data-action="toggle-task" data-project="${esc(p.id)}" data-task="restore">${icon('restore',14)}${restored?'ביטול סימון השחזור':'סימון בדיקת שחזור כבוצעה'}</button></div></div>`;}
function allTasksPage(){const rows=projects.flatMap(p=>taskList(p).map(t=>({p,t}))).filter(({p,t})=>taskFilter==='all'||(taskFilter==='done'?p.done.includes(t.id):!p.done.includes(t.id)));return `<div class="page-heading"><div><div class="eyebrow">צעד אחר צעד, בכל הפרויקטים</div><h1>משימות לטיפול</h1><p>מבט משותף על מה שהושלם ועל מה שעוד דורש תשומת לב.</p></div><a class="btn btn-secondary" href="#projects">${icon('grid',15)}לפרויקטים</a></div><div class="filter-buttons">${[['open','להשלמה'],['done','בוצע'],['all','הכול']].map(([k,n])=>`<button class="filter-btn ${taskFilter===k?'active':''}" data-action="filter" data-filter="${k}" aria-pressed="${taskFilter===k}">${n}</button>`).join('')}</div><div class="attention-panel all-tasks" style="margin-top:0">${rows.map(({p,t})=>{const done=p.done.includes(t.id);return `<div class="task-row"><button class="check-box ${done?'checked':''}" role="checkbox" aria-checked="${done}" data-action="toggle-task" data-project="${esc(p.id)}" data-task="${t.id}" aria-label="שינוי מצב ${esc(t.title)} בפרויקט ${esc(p.name)}">${done?icon('check',13):''}</button><div class="task-info"><strong>${esc(t.title)}</strong><p>${esc(p.name)} · ${stepNames[t.step-1]}</p></div><span class="badge ${done?'neutral':'amber'}">${done?`בוצע${p.doneAt[t.id]?` · ${fmtDate(p.doneAt[t.id])}`:''}`:'ממתין לביצוע'}</span><button class="task-go" data-action="open-task" data-project="${esc(p.id)}" data-task="${t.id}">לפרטים ${icon('chevron',14)}</button></div>`;}).join('')||`<div class="empty-state">${projects.length?'אין משימות בתצוגה הזו.':'עוד אין פרויקטים. משימות יופיעו כאן אחרי יצירת הפרויקט הראשון.'}</div>`}</div><div class="dashboard-note">${icon('info',13)}סימון ידני מתעד ביצוע לפי הדיווח שלך. הוא אינו אישור שהפרויקט מאובטח.</div>`;}

function openDrawer(projectId,role,tab='overview',taskId=null){const p=projects.find(x=>x.id===projectId);if(!p||!p.services[role]||p.services[role]==='none')return;lastFocus=document.activeElement;drawer={projectId,role,tab,taskId};revealed.clear();renderDrawer();document.body.classList.add('no-scroll');requestAnimationFrame(()=>$('#drawer-root [data-action="close-drawer"]')?.focus());}
function renderDrawer(){if(!drawer)return;const p=projects.find(x=>x.id===drawer.projectId);if(!p||p.services[drawer.role]==='none')return closeDrawer();const role=drawer.role,key=p.services[role],provider=providers[key],items=secretItems(p,role),tabs=[['overview','על המערכת'],['tasks','משימות'],['secrets',`פרטי גישה (${items.length})`]];let body='';
  if(drawer.tab==='overview')body=`<p class="detail-description">${esc(provider.desc)}</p><div class="detail-label">קישורים שימושיים</div>${provider.url?`<div class="detail-links"><a class="detail-link" href="${provider.url}" target="_blank" rel="noopener noreferrer">${icon('globe',15)}לאתר ${esc(provider.name)}${icon('external',13)}</a><a class="detail-link" href="${provider.manage}" target="_blank" rel="noopener noreferrer">${icon('external',15)}לעמוד הניהול של השירות${icon('external',13)}</a></div>`:'<div class="account-info"><span>כאן מתעדים את יעד הגיבוי. התוכנית המלאה בלשונית גיבוי ושחזור.</span></div>'}<div class="detail-label">בעלות וחשבון</div><label class="field-label" for="account-owner" style="margin-top:0">החשבון אצל הספק (למשל המייל של בעלי החשבון)</label><div class="inline-form"><input class="text-input" id="account-owner" maxlength="200" dir="auto" autocomplete="off" placeholder="name@example.com" value="${esc(p.accounts[role]||'')}"><button class="btn btn-secondary btn-small" data-action="save-account" data-project="${esc(p.id)}" data-role="${role}">שמירה</button></div><div class="detail-label">מה באחריותך?</div><p class="responsibility">${esc(provider.responsibility)}</p><div class="role-note">הקישורים פותחים את אתר הספק. מצפן אינו מתחבר לחשבון עצמו ואינו בודק את ההגדרות.</div><button class="btn btn-primary" style="margin-top:22px;width:100%" data-action="drawer-tab" data-tab="tasks">${icon('checklist',16)}למשימות של המערכת</button>`;
  else if(drawer.tab==='tasks'){let tasks=taskList(p).filter(t=>t.service===role);if(drawer.taskId){const selected=taskList(p).find(t=>t.id===drawer.taskId);if(selected&&!tasks.some(t=>t.id===selected.id))tasks.unshift(selected);}body=`<p class="intro-line">המשימות מותאמות לתפקיד ${esc(provider.name)} בפרויקט. סמני כל משימה אחרי שביצעת אותה.</p>${tasks.map(t=>taskItem(p,t,true)).join('')||'<div class="empty-state">אין משימות ייעודיות לשירות הזה כרגע.</div>'}<a class="btn btn-secondary" style="margin-top:12px;width:100%" href="#project/${esc(p.id)}/tasks" data-close-drawer>לתהליך העבודה המלא ${icon('arrow',15)}</a>`;}
  else body=`${vaultNotice()}${items.map(x=>secretCard(p,x)).join('')||`<div class="empty-state" style="padding:24px 10px">${icon('key',24)}<h3>אין עדיין פרטי גישה ל־${esc(provider.name)}</h3></div>`}<button class="btn btn-primary" style="width:100%;margin-top:6px" data-action="add-secret" data-project="${esc(p.id)}" data-role="${role}">${icon('plus',15)}פריט גישה חדש</button>${suggestionsBlock(p,suggestions(p,role))}`;
  $('#drawer-root').innerHTML=`<div class="overlay" data-action="close-drawer"></div><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-top"><div class="drawer-kicker"><span>${esc(p.name)} ${icon('chevron',10)} ${esc(roles[role])}</span><button class="icon-button" data-action="close-drawer" aria-label="סגירת כרטיס מערכת">${icon('close',17)}</button></div><div class="drawer-service">${logo(key)}<div><h2 id="drawer-title">${esc(provider.name)}</h2><p>${esc(provider.role)}</p></div></div><nav class="tabs" aria-label="תצוגות כרטיס המערכת">${tabs.map(([id,label])=>`<button class="tab ${drawer.tab===id?'active':''}" data-action="drawer-tab" data-tab="${id}" aria-pressed="${drawer.tab===id}">${label}</button>`).join('')}</nav></header><div class="drawer-body">${body}</div><footer class="drawer-footer">${icon('shield',13)}מצפן מתעד את השירות. הוא אינו מחובר לחשבון שלך אצל הספק.</footer></section>`;
}
function closeDrawer(restoreFocus=true){drawer=null;revealed.clear();$('#drawer-root').innerHTML='';if(!modalType)document.body.classList.remove('no-scroll');if(restoreFocus&&lastFocus?.isConnected)lastFocus.focus();}
let returnDrawer=null;
function openModal(type){if(drawer){returnDrawer={...drawer};closeDrawer(false);}if(!modalType)lastFocus=document.activeElement;modalType=type;document.body.classList.add('no-scroll');}
function reopenDrawer(){const b=returnDrawer;returnDrawer=null;if(b&&!modalType)openDrawer(b.projectId,b.role,b.tab);}
function modalFrame(title,subtitle,content,footer,progress=''){return `<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="icon-button" data-action="close-modal" aria-label="סגירת חלון">${icon('close',18)}</button></header>${progress}<div class="modal-content">${content}</div><footer class="modal-footer">${footer}</footer></section></div>`;}
function closeModal(restoreFocus=true){wizard=null;modalType=null;secretForm=null;confirmAction=null;afterUnlock=null;$('#modal-root').innerHTML='';if(!drawer)document.body.classList.remove('no-scroll');if(pendingRender)rerenderKeepScroll();if(restoreFocus&&lastFocus?.isConnected)lastFocus.focus();}
function rerenderKeepScroll(){const drawerScroll=$('#drawer-root .drawer-body')?.scrollTop,mainScroll=window.scrollY;render();if(drawer&&$('#drawer-root .drawer-body'))$('#drawer-root .drawer-body').scrollTop=drawerScroll||0;window.scrollTo(0,mainScroll);}
function focusFirst(sel){requestAnimationFrame(()=>$(sel)?.focus());}
function showError(id,text){const el=$(id);if(el){el.textContent=text;el.hidden=false;}}

/* ---------- New project wizard ---------- */
function startWizard(){closeDrawer(false);openModal('wizard');wizard={step:1,name:'',type:'website',hosting:'vercel',database:'supabase'};renderWizard();}
function renderWizard(error=''){const w=wizard;if(!w)return;let content='';if(w.step===1){content=`<h3>מה הפרויקט הבא שלך?</h3><p class="muted">נתחיל בשם ובסוג הפרויקט. בהמשך נבחר את המערכות שמרכיבות אותו.</p><label class="field-label" for="project-name">שם הפרויקט</label><input class="text-input" id="project-name" maxlength="60" placeholder="למשל: אתר הגמ״ח" value="${esc(w.name)}" autocomplete="off"><div class="field-help">השם יופיע ברשימת הפרויקטים ובמפה. אפשר לשנות אותו אחר כך.</div>${error?`<p class="form-error" role="alert">${error}</p>`:''}<div class="field-label">סוג הפרויקט</div><div class="type-grid">${[['website','globe','אתר','תוכן, טפסים ודואר'],['donations','heart','ניהול תרומות','תורמים ותהליכי עבודה'],['internal','briefcase','מערכת פנימית','מידע ותהליכים בארגון']].map(([id,i,title,desc])=>`<button class="choice ${w.type===id?'selected':''}" data-action="wizard-choice" data-field="type" data-value="${id}" aria-pressed="${w.type===id}">${icon(i,21)}<strong>${title}</strong><p>${desc}</p></button>`).join('')}</div>`;}
  else if(w.step===2){content=`<h3>אילו מערכות ישמשו את הפרויקט?</h3><p class="muted">התפקידים נשארים קבועים. ההנחיות והמשימות יותאמו לבחירה שלך.</p><div class="field-label">איפה הפרויקט יפעל?</div><div class="provider-options">${[['vercel','אירוח מנוהל'],['render','אירוח מנוהל'],['contabo','שרת בניהול עצמי']].map(([id,desc])=>`<button class="choice ${w.hosting===id?'selected':''}" data-action="wizard-choice" data-field="hosting" data-value="${id}" aria-pressed="${w.hosting===id}">${logo(id)}<strong>${providers[id].name}</strong><p>${desc}</p></button>`).join('')}</div><div class="field-label">איפה יישמר המידע?</div><div class="provider-options">${[['supabase','בסיס נתונים מנוהל'],['airtable','טבלאות ורשומות'],['none','אתר ללא בסיס נתונים']].map(([id,desc])=>`<button class="choice ${w.database===id?'selected':''}" data-action="wizard-choice" data-field="database" data-value="${id}" aria-pressed="${w.database===id}">${logo(id)}<strong>${providers[id].name}</strong><p>${desc}</p></button>`).join('')}</div>${w.hosting==='contabo'?'<div class="role-note">בחירה בשרת בניהול עצמי מוסיפה לתהליך משימות של עדכוני מערכת וחומת אש.</div>':'<div class="wizard-note">גם באירוח מנוהל צריך להגדיר הרשאות, להגן על המפתחות ולתכנן גיבוי לנתונים.</div>'}`;}
  else{const p=makeProject('preview',w.name,w.type,w.hosting,w.database);content=`<h3>המפה של ${esc(w.name)} מוכנה להתחלה</h3><p class="muted">אלה המערכות שיופיעו במפה. לפרויקט יתווסף מסלול של שבעה שלבים עם משימות מותאמות.</p><div class="summary-list">${services(p).map(([role,key])=>`<div class="summary-item">${logo(key)}<div><strong>${esc(providers[key].name)}</strong><p>${esc(roles[role])}</p></div></div>`).join('')}</div><div class="wizard-note">GitHub ו־Cloudflare נוספו כברירת מחדל. אפשר לשנות את השירותים בכל עת דרך עריכת הפרויקט.</div>`;}
  $('#modal-root').innerHTML=modalFrame('פרויקט חדש',`שלב ${w.step} מתוך 3 · בונים תמונה מסודרת`,content,`<button class="btn btn-ghost" data-action="${w.step===1?'close-modal':'wizard-back'}">${w.step===1?'ביטול':'חזרה'}</button><button class="btn btn-primary" data-action="${w.step===3?'wizard-create':'wizard-next'}">${w.step===3?'יצירת הפרויקט':'המשך'}${icon(w.step===3?'check':'arrow',16)}</button>`,`<div class="wizard-progress" aria-label="שלב ${w.step} מתוך 3">${[1,2,3].map(n=>`<span class="${n<=w.step?'current':''}"></span>`).join('')}</div>`);
  if(w.step===1)focusFirst('#project-name');
}

/* ---------- Edit / delete project ---------- */
function openProjectModal(p){closeDrawer(false);openModal('project');secretForm={projectId:p.id};const sel=(role,label)=>`<label class="field-label" for="edit-${role}">${label}</label><select class="text-input" id="edit-${role}">${providerChoices[role].map(k=>`<option value="${k}" ${p.services[role]===k?'selected':''}>${esc(providers[k].name)} — ${esc(providers[k].role)}</option>`).join('')}</select>`;
  $('#modal-root').innerHTML=modalFrame('עריכת הפרויקט',esc(p.name),`<label class="field-label" for="edit-name" style="margin-top:0">שם הפרויקט</label><input class="text-input" id="edit-name" maxlength="60" autocomplete="off" value="${esc(p.name)}"><label class="field-label" for="edit-description">תיאור קצר</label><input class="text-input" id="edit-description" maxlength="200" autocomplete="off" value="${esc(p.description)}">${sel('hosting','אירוח והרצה')}${sel('database','נתונים')}${sel('automation','חיבורים ושירותים')}<p class="form-error" id="project-error" role="alert" hidden></p><div class="danger-zone"><div><strong>מחיקת הפרויקט</strong><p>הפרויקט, המשימות וכל פרטי הגישה שלו יימחקו מכל המכשירים.</p></div><button class="btn btn-secondary btn-small danger" data-action="delete-project" data-project="${esc(p.id)}">${icon('trash',13)}מחיקה</button></div>`,`<button class="btn btn-ghost" data-action="close-modal">ביטול</button><button class="btn btn-primary" data-action="save-project">${icon('check',16)}שמירה</button>`);focusFirst('#edit-name');}
function saveProjectEdit(){const p=projects.find(x=>x.id===secretForm?.projectId);if(!p)return closeModal();const name=$('#edit-name').value.trim();if(!name){showError('#project-error','צריך לתת לפרויקט שם.');$('#edit-name').focus();return;}
  p.name=name;p.description=$('#edit-description').value.trim();for(const role of ['hosting','database','automation']){const v=$(`#edit-${role}`).value;if(providerChoices[role].includes(v))p.services[role]=v;}
  save(p);closeModal(false);render();toast('השינויים בפרויקט נשמרו.');}

/* ---------- Generic confirm ---------- */
function showConfirm(title,body,label,fn){openModal('confirm');confirmAction=fn;$('#modal-root').innerHTML=modalFrame(esc(title),'',`<p class="confirm-body">${body}</p>`,`<button class="btn btn-ghost" data-action="close-modal">ביטול</button><button class="btn btn-primary ${/מחיק/.test(label)?'btn-danger':''}" data-action="confirm">${esc(label)}</button>`);focusFirst('#modal-root [data-action="close-modal"]');}

/* ---------- Vault modals ---------- */
function openSetupModal(){const keep=afterUnlock;openModal('setup');afterUnlock=keep;$('#modal-root').innerHTML=modalFrame('הגדרת סיסמת־אב','פעם אחת, לפני שמירת הסיסמה הראשונה',`<p class="confirm-body">כל הסיסמאות והמפתחות במצפן יוצפנו בסיסמת־האב, כבר בדפדפן ולפני השמירה. הסיסמה עצמה לא נשמרת בשום מקום.</p><label class="field-label" for="master-new">סיסמת־אב (לפחות 10 תווים)</label><input class="text-input" type="password" id="master-new" autocomplete="new-password" dir="ltr"><label class="field-label" for="master-confirm">הקלדה חוזרת של הסיסמה</label><input class="text-input" type="password" id="master-confirm" autocomplete="new-password" dir="ltr"><label class="check-line"><input type="checkbox" id="master-ack"><span>הבנתי: אם אשכח את סיסמת־האב, לא יהיה אפשר לשחזר את הסיסמאות השמורות במצפן.</span></label><p class="form-error" id="vault-error" role="alert" hidden></p>`,`<button class="btn btn-ghost" data-action="close-modal">ביטול</button><button class="btn btn-primary" data-action="setup-vault">${icon('lock',16)}הגדרה ופתיחת הכספת</button>`);focusFirst('#master-new');}
function openUnlockModal(){const keep=afterUnlock;openModal('unlock');afterUnlock=keep;$('#modal-root').innerHTML=modalFrame('פתיחת הכספת','הזיני את סיסמת־האב',`<label class="field-label" for="master-password" style="margin-top:0">סיסמת־האב</label><input class="text-input" type="password" id="master-password" autocomplete="current-password" dir="ltr"><p class="form-error" id="vault-error" role="alert" hidden></p><div class="wizard-note">הכספת תינעל לבד אחרי 10 דקות ללא פעילות, ובכל רענון של הדף.</div>`,`<button class="btn btn-ghost" data-action="close-modal">ביטול</button><button class="btn btn-primary" data-action="unlock-vault">${icon('lock',16)}פתיחה</button>`);focusFirst('#master-password');}
function finishUnlock(){const fn=afterUnlock;afterUnlock=null;touchVault();closeModal(false);reopenDrawer();rerenderKeepScroll();if(fn)fn();}
async function setupVault(btn){const a=$('#master-new').value,b=$('#master-confirm').value;if(a.length<10)return showError('#vault-error','סיסמת־האב צריכה להיות באורך 10 תווים לפחות.');if(a!==b)return showError('#vault-error','שתי ההקלדות אינן זהות.');if(!$('#master-ack').checked)return showError('#vault-error','צריך לאשר שקראת את האזהרה.');
  btn.disabled=true;try{const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iter=310000;const key=await deriveKey(a,salt,iter);const check=await encryptText(key,VAULT_CHECK);vaultMeta={salt,iter,check,createdAt:Date.now()};vaultKey=key;await saveVaultMeta();toast('סיסמת־האב הוגדרה והכספת פתוחה.');finishUnlock();}catch{btn.disabled=false;showError('#vault-error','ההגדרה נכשלה. נסי שוב.');}}
async function unlockVault(btn){const pw=$('#master-password').value;if(!pw)return showError('#vault-error','הזיני את סיסמת־האב.');btn.disabled=true;try{const key=await deriveKey(pw,vaultMeta.salt,vaultMeta.iter);if(await decryptText(key,vaultMeta.check)!==VAULT_CHECK)throw 0;vaultKey=key;finishUnlock();}catch{btn.disabled=false;showError('#vault-error','סיסמת־האב אינה נכונה.');$('#master-password')?.select();}}

/* ---------- Credential items ---------- */
function openSecretModal(projectId,itemId=null,role=null,tid=null){const p=projects.find(x=>x.id===projectId);if(!p)return;withVault(()=>renderSecretModal(p,itemId,role,tid));}
function renderSecretModal(p,itemId,role,tid){const item=itemId?p.extras.find(x=>x.id===itemId):null;if(itemId&&!item)return;const tpl=tid?services(p).flatMap(([r])=>templatesFor(p,r)).find(t=>t.tid===tid):null;const base=item||tpl||{role:role&&p.services[role]!=='none'?role:services(p)[0][0],name:'',kind:'סיסמה',username:'',url:'',purpose:'',where:''};
  openModal('secret');secretForm={projectId:p.id,itemId:item?.id||null};
  $('#modal-root').innerHTML=modalFrame(item?'עריכת פריט גישה':'פריט גישה חדש',esc(p.name),`<label class="field-label" for="secret-service" style="margin-top:0">לאיזו מערכת הפריט שייך?</label><select class="text-input" id="secret-service">${services(p).map(([r,key])=>`<option value="${r}" ${r===base.role?'selected':''}>${esc(providers[key].name)} — ${esc(roles[r])}</option>`).join('')}</select><label class="field-label" for="secret-name">שם הפריט</label><input class="text-input" id="secret-name" maxlength="120" autocomplete="off" placeholder="למשל: סיסמת חשבון הניהול" value="${esc(base.name)}"><label class="field-label" for="secret-kind">סוג</label><select class="text-input" id="secret-kind">${kinds.map(k=>`<option ${k===base.kind?'selected':''}>${k}</option>`).join('')}</select><label class="field-label" for="secret-username">שם משתמש או מייל <span class="optional">(לא חובה)</span></label><input class="text-input" id="secret-username" maxlength="200" dir="ltr" autocomplete="off" value="${esc(base.username||'')}"><label class="field-label" for="secret-value">${item?.secret?'ערך חדש <span class="optional">(השאירי ריק כדי לשמור את הקיים)</span>':'הסיסמה או המפתח'}</label><div class="inline-form"><input class="text-input secret-input" type="password" id="secret-value" autocomplete="new-password" dir="ltr" spellcheck="false"><button type="button" class="icon-button" data-action="toggle-input" aria-label="הצגת הערך שהוקלד">${icon('eye',16)}</button></div><label class="field-label" for="secret-url">כתובת להתחברות <span class="optional">(לא חובה)</span></label><input class="text-input" id="secret-url" maxlength="500" dir="ltr" autocomplete="off" placeholder="https://" value="${esc(base.url||'')}"><label class="field-label" for="secret-purpose">למה הוא משמש</label><input class="text-input" id="secret-purpose" maxlength="300" autocomplete="off" value="${esc(base.purpose||'')}"><label class="field-label" for="secret-where">איפה משתמשים בו</label><input class="text-input" id="secret-where" maxlength="300" autocomplete="off" value="${esc(base.where||'')}"><p class="form-error" id="secret-error" role="alert" hidden></p><div class="wizard-note">${icon('lock',13)} הערך מוצפן בדפדפן בסיסמת־האב לפני השמירה.</div>`,`<button class="btn btn-ghost" data-action="close-modal">ביטול</button><button class="btn btn-primary" data-action="save-secret">${icon('check',16)}שמירה</button>`);focusFirst(base.name?'#secret-value':'#secret-name');}
async function saveSecret(btn){const f=secretForm;const p=projects.find(x=>x.id===f?.projectId);if(!p)return closeModal();const name=$('#secret-name').value.trim();if(!name){showError('#secret-error','צריך לתת לפריט שם.');$('#secret-name').focus();return;}
  const role=$('#secret-service').value;if(!Object.hasOwn(roles,role))return;const value=$('#secret-value').value;
  if(value&&!vaultKey){showError('#secret-error','הכספת ננעלה בזמן העריכה. סגרי את החלון, פתחי את הכספת ונסי שוב.');return;}
  const kind=$('#secret-kind').value;const data={role,name,kind:kinds.includes(kind)?kind:'אחר',username:$('#secret-username').value.trim(),url:$('#secret-url').value.trim(),purpose:$('#secret-purpose').value.trim(),where:$('#secret-where').value.trim(),updatedAt:Date.now()};
  let item=f.itemId?p.extras.find(x=>x.id===f.itemId):null;let secret=item?.secret||null;
  if(value){btn.disabled=true;try{secret=await encryptText(vaultKey,value);}catch{btn.disabled=false;showError('#secret-error','ההצפנה נכשלה. נסי שוב.');return;}}
  if(item)Object.assign(item,data,{secret});else{item={id:'s'+uid().replace(/-/g,'').slice(0,12),...data,secret};p.extras.push(item);}
  revealed.delete(`${p.id}:${item.id}`);save(p);touchVault();closeModal(false);render();toast(value?'הפריט נשמר, והערך מוצפן.':'הפריט נשמר.');}
function findItem(p,id){return p?.extras.find(x=>x.id===id);}
async function revealSecret(p,item){try{const v=await decryptText(vaultKey,item.secret);revealed.set(`${p.id}:${item.id}`,v);rerenderKeepScroll();}catch{toast('לא ניתן לפענח את הערך בסיסמת־האב הנוכחית.');}}
async function copySecret(p,item){let v;try{v=await decryptText(vaultKey,item.secret);}catch{toast('לא ניתן לפענח את הערך בסיסמת־האב הנוכחית.');return;}try{await navigator.clipboard.writeText(v);toast('הערך הועתק. מומלץ לנקות את הלוח אחרי השימוש.');}catch{revealed.set(`${p.id}:${item.id}`,v);rerenderKeepScroll();toast('ההעתקה נחסמה כאן. הערך מוצג, ואפשר לסמן ולהעתיק אותו.');}}

/* ---------- Backup export / import ---------- */
async function exportBackup(){const data={app:'matzpen',version:1,exportedAt:new Date().toISOString(),vault:vaultMeta,projects:projects.map(p=>({id:p.id,...projectData(p)}))};const text=JSON.stringify(data,null,2);const filename=`matzpen-backup-${todayIso()}.json`;
  let dl=null;try{dl=await window.claude?.use?.('downloads');}catch{}
  if(!dl){toast('שמירת קבצים אינה זמינה בתצוגה הזו.');return;}
  try{await dl.save({filename,data:new Blob([text],{type:'application/json'})});toast('קובץ הגיבוי נשמר. הסיסמאות בו נשארות מוצפנות.');}catch{toast('שמירת הגיבוי בוטלה.');}}
async function importBackup(file){let data;try{if(file.size>5e6)throw 0;data=JSON.parse(await file.text());}catch{toast('הקובץ אינו קובץ גיבוי תקין של מצפן.');return;}
  if(data?.app!=='matzpen'||!Array.isArray(data.projects)){toast('הקובץ אינו קובץ גיבוי של מצפן.');return;}
  const list=data.projects.map(x=>typeof x?.id==='string'&&/^p-[\w-]{1,40}$/.test(x.id)?normalizeProject(x.id,x):null).filter(Boolean).slice(0,200);
  const vault=data.vault&&typeof data.vault.salt==='string'&&typeof data.vault.iter==='number'&&isBox(data.vault.check)?{salt:data.vault.salt,iter:data.vault.iter,check:data.vault.check,createdAt:data.vault.createdAt||0}:null;
  const hasSecrets=list.some(p=>p.extras.some(x=>x.secret));
  if(hasSecrets&&vault&&vaultMeta&&vault.salt!==vaultMeta.salt){toast('הסיסמאות בקובץ הוצפנו בסיסמת־אב אחרת, ולכן אי אפשר לייבא אותן לכאן.');return;}
  if(!list.length){toast('לא נמצאו פרויקטים בקובץ.');return;}
  const existing=list.filter(p=>projects.some(x=>x.id===p.id)).length;
  showConfirm('ייבוא מגיבוי',`בקובץ ${list.length} פרויקטים${data.exportedAt?` מתאריך ${fmtDate(Date.parse(data.exportedAt))}`:''}. ${existing?`${existing} מהם כבר קיימים כאן ויוחלפו בגרסה שבקובץ. `:''}השאר יתווספו.`,'ייבוא',()=>{
    if(!vaultMeta&&vault){vaultMeta=vault;saveVaultMeta();}
    for(const p of list){const i=projects.findIndex(x=>x.id===p.id);if(i>=0)projects[i]=p;else projects.push(p);save(p);}
    closeModal(false);navigate('#projects');toast(`יובאו ${list.length} פרויקטים.`);});}

function showHelp(){closeDrawer(false);openModal('help');$('#modal-root').innerHTML=modalFrame('איך מצפן עובד','מפה, תהליך וכספת לכל פרויקט',`<div class="help-icon">${icon('compass',27)}</div><div class="help-list"><div><strong>1. פרויקט חדש</strong><p>בוחרים שם, סוג ושירותים. מצפן בונה מפה של המערכות ותהליך של שבעה שלבים.</p></div><div><strong>2. מפת הפרויקט</strong><p>לחיצה על מערכת פותחת את התפקיד שלה, את המשימות ואת פרטי הגישה שלה, ומאפשרת לתעד את החשבון אצל הספק.</p></div><div><strong>3. כספת פרטי הגישה</strong><p>סיסמאות ומפתחות מוצפנים בדפדפן בסיסמת־האב לפני השמירה. הסיסמה עצמה לא נשמרת בשום מקום, ובלעדיה אי אפשר לשחזר את הערכים.</p></div><div><strong>4. סנכרון</strong><p>הנתונים שמורים בחשבון שלך ב־Claude ומופיעים בכל מכשיר שבו את מחוברת. רק את רואה אותם.</p></div><div><strong>5. גיבוי</strong><p>ייצוא גיבוי שומר קובץ עם כל הנתונים. הסיסמאות בו נשארות מוצפנות. כדאי לשמור אותו במקום נפרד ולייבא ממנו בעת הצורך.</p></div></div>`,`<button class="btn btn-secondary" data-action="export">${icon('download',15)}ייצוא גיבוי</button><button class="btn btn-secondary" data-action="import">${icon('upload',15)}ייבוא</button><button class="btn btn-primary" data-action="close-modal">סגירה</button>`);focusFirst('#modal-root [data-action="close-modal"]');}

/* ---------- Events ---------- */
document.addEventListener('click',async event=>{
  if(event.target.closest('.skip-link')){event.preventDefault();$('#main')?.focus();$('#main')?.scrollIntoView({block:'start'});return;}
  const link=event.target.closest('a[href^="#"]');if(link){event.preventDefault();navigate(link.getAttribute('href'));return;}
  const element=event.target.closest('[data-action]');
  if(!element)return;
  const action=element.dataset.action,p=projects.find(x=>x.id===element.dataset.project);
  switch(action){
    case 'new-project':startWizard();break;
    case 'help':showHelp();break;
    case 'close-modal':closeModal();reopenDrawer();break;
    case 'service':openDrawer(element.dataset.project,element.dataset.service);break;
    case 'close-drawer':closeDrawer();break;
    case 'drawer-tab':if(drawer){drawer.tab=element.dataset.tab;revealed.clear();renderDrawer();$('#drawer-root .tab.active')?.focus();}break;
    case 'open-task':if(p){const t=taskList(p).find(x=>x.id===element.dataset.task);if(t)openDrawer(p.id,t.service,'tasks',t.id);}break;
    case 'toggle-task':if(p){const id=element.dataset.task;if(!taskList(p).some(t=>t.id===id))break;const wasDone=p.done.includes(id);p.done=wasDone?p.done.filter(x=>x!==id):[...p.done,id];if(wasDone)delete p.doneAt[id];else p.doneAt[id]=todayIso();save(p);rerenderKeepScroll();const root=drawer?$('#drawer-root'):$('#main');root?.querySelector(`[data-action="toggle-task"][data-project="${p.id}"][data-task="${id}"]`)?.focus({preventScroll:true});toast(wasDone?'המשימה הוחזרה להשלמה.':'המשימה סומנה כבוצעה.');}break;
    case 'filter':taskFilter=element.dataset.filter;render();$(`[data-filter="${taskFilter}"]`)?.focus();break;
    case 'reveal':if(p){const item=findItem(p,element.dataset.secret);if(!item?.secret)break;const key=`${p.id}:${item.id}`;if(revealed.has(key)){revealed.delete(key);rerenderKeepScroll();}else withVault(()=>revealSecret(p,item));}break;
    case 'copy':if(p){const item=findItem(p,element.dataset.secret);if(item?.secret)withVault(()=>copySecret(p,item));}break;
    case 'copy-user':if(p){const item=findItem(p,element.dataset.secret);if(!item)break;try{await navigator.clipboard.writeText(item.username);toast('שם המשתמש הועתק.');}catch{toast('ההעתקה נחסמה כאן. אפשר לסמן את הטקסט ולהעתיק.');}}break;
    case 'add-secret':if(p)openSecretModal(p.id,null,element.dataset.role||null,element.dataset.template||null);break;
    case 'edit-secret':if(p)openSecretModal(p.id,element.dataset.secret);break;
    case 'save-secret':await saveSecret(element);if(!modalType)reopenDrawer();break;
    case 'toggle-input':{const input=$('#secret-value');if(input){const show=input.type==='password';input.type=show?'text':'password';element.innerHTML=icon(show?'eyeoff':'eye',16);element.setAttribute('aria-label',show?'הסתרת הערך שהוקלד':'הצגת הערך שהוקלד');}break;}
    case 'delete-secret':if(p){const item=findItem(p,element.dataset.secret);if(!item)break;showConfirm('מחיקת פריט גישה',`למחוק את "${esc(item.name)}"? הפריט והערך המוצפן שלו יימחקו מכל המכשירים. אי אפשר לבטל.`,'מחיקה',()=>{p.extras=p.extras.filter(x=>x.id!==item.id);revealed.delete(`${p.id}:${item.id}`);save(p);closeModal(false);render();reopenDrawer();toast('הפריט נמחק.');});}break;
    case 'save-account':if(p){const role=element.dataset.role;if(!Object.hasOwn(roles,role))break;const v=$('#account-owner').value.trim().slice(0,200);if(v)p.accounts[role]=v;else delete p.accounts[role];save(p);$('#account-owner').blur();rerenderKeepScroll();toast('פרטי החשבון נשמרו.');}break;
    case 'edit-project':if(p)openProjectModal(p);break;
    case 'save-project':saveProjectEdit();break;
    case 'delete-project':if(p){showConfirm('מחיקת הפרויקט',`למחוק את "${esc(p.name)}"? הפרויקט, המשימות ו־${p.extras.length} פרטי הגישה שלו יימחקו מכל המכשירים. אי אפשר לבטל.`,'מחיקה',()=>{projects=projects.filter(x=>x.id!==p.id);removeProjectDoc(p.id);closeModal(false);navigate('#projects');toast('הפרויקט נמחק.');});}break;
    case 'confirm':if(confirmAction){const fn=confirmAction;confirmAction=null;fn();}break;
    case 'vault-toggle':if(vaultKey){lockVault();toast('הכספת ננעלה.');}else withVault(()=>toast('הכספת פתוחה.'));break;
    case 'setup-vault':await setupVault(element);break;
    case 'unlock-vault':await unlockVault(element);break;
    case 'export':await exportBackup();break;
    case 'import':$('#import-file').value='';$('#import-file').click();break;
    case 'wizard-choice':if(wizard){const name=$('#project-name');if(name)wizard.name=name.value;const {field,value}=element.dataset;const allowed={type:['website','donations','internal'],hosting:['vercel','render','contabo'],database:['supabase','airtable','none']};if(!allowed[field]?.includes(value))break;wizard[field]=value;renderWizard();$(`[data-field="${field}"][data-value="${value}"]`)?.focus();}break;
    case 'wizard-next':if(wizard){if(wizard.step===1){wizard.name=$('#project-name').value.trim();if(!wizard.name){renderWizard('צריך לתת לפרויקט שם כדי להמשיך.');break;}}wizard.step=Math.min(3,wizard.step+1);renderWizard();$('#modal-root [data-action="close-modal"]')?.focus();}break;
    case 'wizard-back':if(wizard){wizard.step=Math.max(1,wizard.step-1);renderWizard();}break;
    case 'wizard-create':if(wizard){const w=wizard;const project=makeProject(`p-${uid().replace(/-/g,'').slice(0,12)}`,w.name,w.type,w.hosting,w.database);projects.push(project);save(project);closeModal(false);navigate(`#project/${project.id}/map`);toast('הפרויקט נוצר. המפה ותהליך העבודה מוכנים.');}break;
  }
});
document.addEventListener('change',event=>{if(event.target.id==='import-file'){const f=event.target.files?.[0];if(f)importBackup(f);}});
document.addEventListener('input',event=>{if(event.target.id==='vault-search'){const term=event.target.value.toLocaleLowerCase('he').trim();let count=0;document.querySelectorAll('#vault-items .secret-card').forEach(card=>{const visible=card.dataset.search.includes(term);card.hidden=!visible;if(visible)count++;});const empty=$('#vault-empty');if(empty)empty.hidden=count>0;}if(event.target.id==='project-name'&&wizard)wizard.name=event.target.value;if(modalType==='secret'&&vaultKey)touchVault();});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!modalType&&!isTyping())rerenderKeepScroll();},0);});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(modalType)$('#modal-root [data-action="close-modal"]')?.click();else if(drawer)closeDrawer();return;}
  if(event.key==='Enter'){const id=event.target.id;const map={'project-name':'wizard-next','master-password':'unlock-vault','master-confirm':'setup-vault','account-owner':'save-account','edit-name':'save-project','edit-description':'save-project'};if(map[id]){event.preventDefault();(id==='account-owner'?$('#drawer-root [data-action="save-account"]'):$(`#modal-root [data-action="${map[id]}"]`))?.click();return;}}
  if(event.key==='Tab'&&(modalType||drawer)){const container=$(modalType?'#modal-root .modal':'#drawer-root .drawer');if(!container)return;const items=[...container.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="0"]')].filter(e=>!e.hidden&&e.offsetParent!==null);const first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||!container.contains(document.activeElement))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&(document.activeElement===last||!container.contains(document.activeElement))){event.preventDefault();first?.focus();}}
});
init();

</script>
